/* ==========================================================================
   FOCUS ROOM — body doubling
   Every sound is synthesised with the Web Audio API and every visual is drawn
   with Canvas, so the feature adds no files and works with no connection.
   ========================================================================== */
const AMBIENCES = [
  { id:'rain',   name:'Rain on glass', sub:'Soft, steady, masks noise' },
  { id:'cafe',   name:'Café corner',   sub:'Warm murmur + clinks' },
  { id:'brown',  name:'Brown noise',   sub:'Deep, even, no texture' },
  { id:'hum',    name:'Studio hum',    sub:'Low drone, very plain' },
  { id:'none',   name:'Silence',       sub:'Visuals only' }
];
const SCENES = [
  { id:'breathe', name:'Breathe',  sub:'Paced orb, calms starting' },
  { id:'drift',   name:'Drift',    sub:'Slow particle field' },
  { id:'pulse',   name:'Pulse',    sub:'Reacts to the sound' },
  { id:'minimal', name:'Minimal',  sub:'Almost still' }
];
const CHECKIN_LINES = [
  'Still here. Working away.',
  'Nice steady pace. Keep going.',
  'Halfway feeling? Just the next small bit.',
  'I got distracted for a second too. Back to it.',
  'Good stretch of work, this.',
  'If you are stuck, write the ugly version first.',
  'Still typing over here. You are not doing this alone.'
];

const FocusAudio = {
  ctx: null, master: null, analyser: null, bed: [], typingOn: false, typingTimer: null,
  activeAmbience: 'none', muted: false, typingBurstEnergy: 0,

  ensureCtx(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 256;
      this.master.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
    }
    if(this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    return this.ctx;
  },

  noiseBuffer(kind){
    const ctx = this.ctx;
    const len = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    if(kind === 'brown'){
      let last = 0;
      for(let i=0;i<len;i++){
        const white = Math.random()*2-1;
        last = (last + 0.02*white) / 1.02;
        d[i] = last * 3.2;
      }
    } else {
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    return buf;
  },

  loopNoise(kind, gainVal){
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(kind);
    src.loop = true;
    const g = this.ctx.createGain();
    g.gain.value = gainVal;
    src.connect(g);
    src.start();
    this.bed.push(src, g);
    return { src, g };
  },

  /* Slow random gain drift, so beds never sound like a static loop. */
  addDrift(gainNode, base, depth, rateSec){
    const lfo = this.ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 1 / rateSec;
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = depth;
    lfo.connect(lfoGain);
    lfoGain.connect(gainNode.gain);
    gainNode.gain.value = base;
    lfo.start();
    this.bed.push(lfo, lfoGain);
  },

  buildAmbience(kind){
    const ctx = this.ctx;
    if(kind === 'rain'){
      const { g } = this.loopNoise('white', 0.5);
      const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=420;
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
      g.connect(hp); hp.connect(lp); lp.connect(this.master);
      this.addDrift(g, 0.5, 0.12, 9);
      this.bed.push(hp, lp);
    } else if(kind === 'cafe'){
      const { g } = this.loopNoise('brown', 0.75);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=780;
      g.connect(lp); lp.connect(this.master);
      const murmur = this.loopNoise('white', 0.22);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=1.1;
      murmur.g.connect(bp); bp.connect(this.master);
      this.addDrift(murmur.g, 0.2, 0.1, 6.5);
      this.bed.push(lp, bp);
      this.scheduleClinks();
    } else if(kind === 'brown'){
      const { g } = this.loopNoise('brown', 0.85);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;
      g.connect(lp); lp.connect(this.master);
      this.bed.push(lp);
    } else if(kind === 'hum'){
      [58, 87, 116].forEach((f, i)=>{
        const osc = ctx.createOscillator();
        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.value = f + (Math.random()*0.6-0.3);
        const g = ctx.createGain();
        g.gain.value = i === 0 ? 0.16 : 0.05;
        osc.connect(g); g.connect(this.master);
        osc.start();
        this.bed.push(osc, g);
      });
      const { g } = this.loopNoise('brown', 0.12);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
      g.connect(lp); lp.connect(this.master);
      this.bed.push(lp);
    }
  },

  scheduleClinks(){
    const tick = ()=>{
      if(this.activeAmbience !== 'cafe' || !this.ctx) return;
      this.ping(1400 + Math.random()*900, 0.035, 0.32);
      this.clinkTimer = setTimeout(tick, 7000 + Math.random()*16000);
    };
    this.clinkTimer = setTimeout(tick, 5000 + Math.random()*8000);
  },

  ping(freq, gainVal, decay){
    if(!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = this.ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gainVal, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + decay + 0.05);
  },

  /* One keystroke: a very short filtered noise burst plus a quiet key thud. */
  keystroke(strength){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 0.02 + Math.random()*0.02;
    const src = this.ctx.createBufferSource();
    const buf = this.ctx.createBuffer(1, Math.ceil(this.ctx.sampleRate*dur), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    src.buffer = buf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random()*2200;
    bp.Q.value = 0.9;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.09 * strength, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.03);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
    const thud = this.ctx.createOscillator();
    const tg = this.ctx.createGain();
    thud.type = 'triangle';
    thud.frequency.value = 110 + Math.random()*50;
    tg.gain.setValueAtTime(0.0001, t);
    tg.gain.linearRampToValueAtTime(0.022 * strength, t + 0.004);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
    thud.connect(tg); tg.connect(this.master);
    thud.start(t); thud.stop(t + 0.09);
    this.typingBurstEnergy = Math.min(1, this.typingBurstEnergy + 0.35);
  },

  /* Human typing rhythm: bursts of keys, then thinking pauses. */
  startTyping(){
    this.typingOn = true;
    let keysLeft = 0;
    const step = ()=>{
      if(!this.typingOn || !this.ctx) return;
      let gap;
      if(keysLeft > 0){
        this.keystroke(0.55 + Math.random()*0.45);
        keysLeft--;
        gap = 70 + Math.random()*110;
        if(Math.random() < 0.08){ gap += 400 + Math.random()*900; }
      } else {
        keysLeft = 3 + Math.floor(Math.random()*11);
        gap = 500 + Math.random()*2600;
        if(Math.random() < 0.16) gap += 2000 + Math.random()*4500; // longer think
      }
      this.typingTimer = setTimeout(step, gap);
    };
    this.typingTimer = setTimeout(step, 700 + Math.random()*1200);
  },
  stopTyping(){
    this.typingOn = false;
    clearTimeout(this.typingTimer);
  },

  chime(kind){
    if(!this.ctx || !state.settings.focus.chimes) return;
    const notes = kind === 'break' ? [523.25, 659.25, 783.99] : [783.99, 659.25, 523.25];
    notes.forEach((f,i)=> setTimeout(()=> this.ping(f, 0.13, 1.5), i*170));
  },

  start(ambience, companion){
    if(!this.ensureCtx()) return false;
    this.stopBed();
    this.activeAmbience = ambience;
    if(ambience !== 'none') this.buildAmbience(ambience);
    if(companion) this.startTyping(); else this.stopTyping();
    this.applyVolume();
    return true;
  },

  applyVolume(fast){
    if(!this.master || !this.ctx) return;
    const target = this.muted ? 0 : clamp(Number(state.settings.focus.volume)||0, 0, 1) * 0.85;
    // Muting should feel instant; volume changes should glide.
    const tau = fast ? 0.02 : 0.25;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(target, this.ctx.currentTime, tau);
  },

  setMuted(m){ this.muted = m; this.applyVolume(true); },

  stopBed(){
    clearTimeout(this.clinkTimer);
    this.bed.forEach(n=>{ try{ if(n.stop) n.stop(); n.disconnect(); }catch(e){} });
    this.bed = [];
  },

  stopAll(){
    this.stopTyping();
    this.stopBed();
    if(this.master && this.ctx){
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
    }
    this.activeAmbience = 'none';
  },

  level(){
    if(!this.analyser) return 0;
    const arr = new Uint8Array(this.analyser.frequencyBinCount);
    this.analyser.getByteFrequencyData(arr);
    let sum = 0;
    for(let i=0;i<arr.length;i++) sum += arr[i];
    return (sum/arr.length)/255;
  }
};

const FocusVisuals = {
  canvas: null, ctx: null, raf: null, t0: 0, particles: [], dpr: 1, w: 0, h: 0,
  reduced: false, breathPhase: '',

  prefersReduced(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  },

  attach(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.reduced = this.prefersReduced();
    this.t0 = performance.now();
    this.resize();
    this.seedParticles();
    this._onResize = ()=> { this.resize(); this.seedParticles(); };
    window.addEventListener('resize', this._onResize);
    this.loop();
  },

  detach(){
    cancelAnimationFrame(this.raf);
    this.raf = null;
    if(this._onResize) window.removeEventListener('resize', this._onResize);
    this.canvas = null; this.ctx = null;
  },

  resize(){
    if(!this.canvas) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = this.canvas.getBoundingClientRect();
    this.w = Math.max(r.width, 320); this.h = Math.max(r.height, 320);
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  },

  seedParticles(){
    const count = this.reduced ? 22 : Math.min(110, Math.round(this.w*this.h/13000));
    this.particles = Array.from({length: count}, ()=>({
      x: Math.random()*this.w, y: Math.random()*this.h,
      r: 1 + Math.random()*2.6,
      vx: (Math.random()-0.5)*0.16, vy: -0.06 - Math.random()*0.26,
      a: 0.28 + Math.random()*0.45,
      hue: Math.random() < 0.72 ? 'accent' : 'signal'
    }));
  },

  loop(){
    if(!this.ctx) return;
    const now = performance.now();
    const t = (now - this.t0)/1000;
    const scene = state.settings.focus.scene;
    const ctx = this.ctx;
    ctx.clearRect(0,0,this.w,this.h);

    // shared dark base wash
    const base = ctx.createLinearGradient(0,0,this.w,this.h);
    base.addColorStop(0, '#0A0E1A');
    base.addColorStop(0.55, '#0C1220');
    base.addColorStop(1, '#0A0E1A');
    ctx.fillStyle = base;
    ctx.fillRect(0,0,this.w,this.h);

    if(scene === 'breathe') this.drawBreathe(ctx, t);
    else if(scene === 'drift') this.drawDrift(ctx, t);
    else if(scene === 'pulse') this.drawPulse(ctx, t);
    else this.drawMinimal(ctx, t);

    this.drawCompanion(ctx, t);

    this.raf = requestAnimationFrame(()=> this.loop());
  },

  /* 4s in · 2s hold · 6s out — a standard calming cadence. */
  breathValue(t){
    const cycle = 12, x = t % cycle;
    if(x < 4){ this.breathPhase = 'Breathe in'; return this.ease(x/4); }
    if(x < 6){ this.breathPhase = 'Hold'; return 1; }
    this.breathPhase = 'Breathe out';
    return 1 - this.ease((x-6)/6);
  },
  ease(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; },

  /* Scenes centre on the timer ring, not the raw canvas, so the orb and the
     countdown read as one object. */
  focusCentre(){
    if(this._centreCache && performance.now() - this._centreAt < 400) return this._centreCache;
    const el = document.querySelector('.timer-wrap');
    let c = { x: this.w/2, y: this.h/2 };
    if(el){
      const r = el.getBoundingClientRect();
      if(r.width > 0) c = { x: r.left + r.width/2, y: r.top + r.height/2 };
    }
    this._centreCache = c; this._centreAt = performance.now();
    return c;
  },

  drawBreathe(ctx, t){
    const c = this.focusCentre();
    const cx = c.x, cy = c.y;
    const v = this.reduced ? 0.55 : this.breathValue(t);
    const rBase = Math.min(this.w, this.h) * 0.16;
    const r = rBase * (0.72 + v*0.55);
    const glow = ctx.createRadialGradient(cx, cy, r*0.15, cx, cy, r*2.6);
    glow.addColorStop(0, 'rgba(240,24,122,' + (0.30 + v*0.16).toFixed(3) + ')');
    glow.addColorStop(0.45, 'rgba(240,24,122,0.07)');
    glow.addColorStop(1, 'rgba(240,24,122,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r*2.6, 0, Math.PI*2); ctx.fill();
    for(let i=0;i<3;i++){
      const rr = r * (1 + i*0.42) + (this.reduced?0:Math.sin(t*0.7 + i)*4);
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(248,250,252,' + (0.07 - i*0.02).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    const core = ctx.createRadialGradient(cx, cy-r*0.3, r*0.1, cx, cy, r);
    core.addColorStop(0, 'rgba(255,120,180,0.30)');
    core.addColorStop(1, 'rgba(240,24,122,0.05)');
    ctx.fillStyle = core;
    ctx.fill();
    if(!this.reduced) this.drawParticles(ctx, 0.35);
  },

  drawDrift(ctx, t){
    const g = ctx.createRadialGradient(this.w*0.7, this.h*0.25, 40, this.w*0.7, this.h*0.25, this.w*0.6);
    g.addColorStop(0, 'rgba(240,24,122,0.10)');
    g.addColorStop(1, 'rgba(240,24,122,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,this.w,this.h);
    const g2 = ctx.createRadialGradient(this.w*0.2, this.h*0.8, 40, this.w*0.2, this.h*0.8, this.w*0.5);
    g2.addColorStop(0, 'rgba(163,230,53,0.07)');
    g2.addColorStop(1, 'rgba(163,230,53,0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,this.w,this.h);
    this.drawParticles(ctx, 1);
    if(!this.reduced){
      ctx.strokeStyle = 'rgba(248,250,252,0.04)';
      ctx.lineWidth = 1;
      for(let i=0;i<4;i++){
        ctx.beginPath();
        const yOff = this.h*(0.25 + i*0.17);
        for(let x=0;x<=this.w;x+=18){
          const y = yOff + Math.sin((x/220) + t*0.14 + i)*16;
          x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }
  },

  drawPulse(ctx, t){
    const c = this.focusCentre();
    const cx = c.x, cy = c.y;
    const lvl = this.reduced ? 0.3 : (0.18 + FocusAudio.level()*1.5);
    const rBase = Math.min(this.w,this.h)*0.13;
    for(let ring=0; ring<5; ring++){
      const rr = rBase*(1+ring*0.34) * (1 + lvl*0.22);
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2+0.01;a+=Math.PI/60){
        const wob = Math.sin(a*5 + t*1.6 + ring)*rBase*0.06*lvl*4;
        const x = cx + Math.cos(a)*(rr+wob);
        const y = cy + Math.sin(a)*(rr+wob);
        a === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = ring % 2 === 0
        ? 'rgba(240,24,122,' + (0.34 - ring*0.05).toFixed(3) + ')'
        : 'rgba(163,230,53,' + (0.22 - ring*0.035).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    const glow = ctx.createRadialGradient(cx,cy,10,cx,cy,rBase*2.6);
    glow.addColorStop(0, 'rgba(240,24,122,' + (0.16+lvl*0.2).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(240,24,122,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx,cy,rBase*2.6,0,Math.PI*2); ctx.fill();
  },

  drawMinimal(ctx, t){
    const shift = this.reduced ? 0.5 : (Math.sin(t*0.06)*0.5+0.5);
    const g = ctx.createLinearGradient(0, this.h, this.w, 0);
    g.addColorStop(0, 'rgba(240,24,122,0.055)');
    g.addColorStop(clamp(0.3+shift*0.35, 0, 1), 'rgba(163,230,53,0.03)');
    g.addColorStop(1, 'rgba(10,14,26,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,this.w,this.h);
  },

  drawParticles(ctx, opacity){
    this.particles.forEach(p=>{
      if(!this.reduced){
        p.x += p.vx; p.y += p.vy;
        if(p.y < -10) { p.y = this.h + 8; p.x = Math.random()*this.w; }
        if(p.x < -10) p.x = this.w + 8;
        if(p.x > this.w + 10) p.x = -8;
      }
      const alpha = p.a*opacity;
      if(p.r > 2.4){
        // a soft halo on the larger motes so drifting motion is easy to read
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3.2);
        g.addColorStop(0, (p.hue === 'accent' ? 'rgba(255,90,170,' : 'rgba(190,240,110,') + (alpha*0.5).toFixed(3) + ')');
        g.addColorStop(1, (p.hue === 'accent' ? 'rgba(240,24,122,0)' : 'rgba(163,230,53,0)'));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3.2, 0, Math.PI*2); ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = (p.hue === 'accent' ? 'rgba(255,110,180,' : 'rgba(190,240,110,') + alpha.toFixed(3) + ')';
      ctx.fill();
    });
  },

  /* The body double: a desk silhouette that breathes, types in sync with the
     audio, and occasionally reaches for a drink. Deliberately abstract. */
  drawCompanion(ctx, t){
    if(!state.settings.focus.companion) return;
    // Too tight to draw a desk on narrow screens — the presence chip's typing
    // dots carry the partner's presence there instead.
    if(this.w < 900) return;
    const scale = Math.min(1.7, Math.max(1.0, this.w/1050));
    // Stand the desk on top of the bottom-left panel so nothing is hidden.
    let floor = this.h - 30;
    const panel = document.querySelector('.room-panel');
    if(panel){
      const r = panel.getBoundingClientRect();
      if(r.height > 0) floor = Math.max(this.h*0.52, r.top - 14);
    }
    const baseX = Math.max(96, this.w*0.13), baseY = floor;
    const breathe = this.reduced ? 0 : Math.sin(t*0.9)*1.6;
    const energy = FocusAudio.typingBurstEnergy;
    FocusAudio.typingBurstEnergy = Math.max(0, energy - 0.045);
    const sipCycle = (t % 47) / 47;
    const sipping = !this.reduced && sipCycle > 0.93;

    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.scale(scale, scale);

    // soft presence glow so the figure sits in the scene rather than on it
    const halo = ctx.createRadialGradient(18, -58, 8, 18, -58, 118);
    halo.addColorStop(0, 'rgba(240,24,122,0.20)');
    halo.addColorStop(1, 'rgba(240,24,122,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(-100, -170, 230, 190);

    // desk
    ctx.fillStyle = 'rgba(248,250,252,0.16)';
    ctx.fillRect(-58, -6, 168, 5);
    ctx.fillStyle = 'rgba(248,250,252,0.07)';
    ctx.fillRect(-46, -1, 4, 30);
    ctx.fillRect(96, -1, 4, 30);

    // chair back
    ctx.fillStyle = 'rgba(248,250,252,0.075)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-16, -100 + breathe, 48, 74, 18); else ctx.rect(-16, -100 + breathe, 48, 74);
    ctx.fill();

    // torso + shoulders
    const grad = ctx.createLinearGradient(0, -96, 0, -20);
    grad.addColorStop(0, 'rgba(244,60,140,0.80)');
    grad.addColorStop(1, 'rgba(200,16,106,0.34)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-8, -14);
    ctx.quadraticCurveTo(-13, -66 + breathe, 8, -74 + breathe);
    ctx.quadraticCurveTo(29, -66 + breathe, 28, -14);
    ctx.closePath();
    ctx.fill();
    // rim light so the silhouette separates from the dark background
    ctx.strokeStyle = 'rgba(255,205,228,0.30)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // neck + head
    ctx.fillStyle = 'rgba(255,150,196,0.62)';
    ctx.fillRect(4, -82 + breathe, 10, 10);
    ctx.beginPath();
    ctx.arc(9, -88 + breathe, 12, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,160,200,0.86)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,235,0.35)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // laptop, drawn before the arms so the hands land on the keys
    ctx.fillStyle = 'rgba(248,250,252,0.22)';
    ctx.beginPath();
    ctx.moveTo(44, -18); ctx.lineTo(86, -18); ctx.lineTo(90, -8); ctx.lineTo(40, -8);
    ctx.closePath(); ctx.fill();
    const screen = ctx.createLinearGradient(54, -50, 84, -20);
    const glow = 0.30 + energy*0.42;
    screen.addColorStop(0, 'rgba(163,230,53,' + glow.toFixed(3) + ')');
    screen.addColorStop(1, 'rgba(163,230,53,' + (glow*0.45).toFixed(3) + ')');
    ctx.fillStyle = screen;
    ctx.beginPath();
    ctx.moveTo(50, -20); ctx.lineTo(84, -20); ctx.lineTo(80, -50); ctx.lineTo(54, -50);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(163,230,53,' + (0.22 + energy*0.3).toFixed(3) + ')';
    ctx.lineWidth = 1; ctx.stroke();

    // arms: forearms twitch with each keystroke burst
    const jitter = energy * (Math.random()*2.6 - 1.3);
    ctx.strokeStyle = 'rgba(255,155,198,0.72)';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    const hand = (x,y)=>{ ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI*2); ctx.fillStyle='rgba(255,180,212,0.82)'; ctx.fill(); };

    if(sipping){
      // left arm stays on the keys, right hand brings the mug up to the face
      ctx.beginPath();
      ctx.moveTo(2, -54 + breathe);
      ctx.quadraticCurveTo(26, -40, 52, -21);
      ctx.stroke();
      hand(52, -21);
      ctx.beginPath();
      ctx.moveTo(22, -56 + breathe);
      ctx.quadraticCurveTo(32, -76, 20, -84 + breathe);
      ctx.stroke();
      ctx.fillStyle = 'rgba(248,250,252,0.28)';
      ctx.fillRect(15, -92 + breathe, 11, 12);
    } else {
      ctx.beginPath();
      ctx.moveTo(2, -54 + breathe);
      ctx.quadraticCurveTo(26, -40 + jitter, 54, -20 + jitter*0.5);
      ctx.stroke();
      hand(54, -20 + jitter*0.5);
      ctx.beginPath();
      ctx.moveTo(22, -56 + breathe);
      ctx.quadraticCurveTo(44, -38 - jitter, 68, -20 - jitter*0.5);
      ctx.stroke();
      hand(68, -20 - jitter*0.5);
      // mug on the desk
      ctx.fillStyle = 'rgba(248,250,252,0.26)';
      ctx.fillRect(-38, -20, 11, 13);
      ctx.beginPath();
      ctx.arc(-25, -14, 4, -Math.PI/2, Math.PI/2);
      ctx.strokeStyle = 'rgba(248,250,252,0.26)';
      ctx.lineWidth = 1.6; ctx.stroke();
      if(!this.reduced){
        ctx.strokeStyle = 'rgba(248,250,252,0.16)';
        ctx.lineWidth = 1.4;
        for(let i=0;i<2;i++){
          const rise = (t*6 + i*9) % 18;
          ctx.beginPath();
          ctx.moveTo(-34 + i*5, -22 - rise);
          ctx.quadraticCurveTo(-31 + i*5 + Math.sin(t*2+i)*2.5, -28 - rise, -34 + i*5, -33 - rise);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
};

/* ==========================================================================
   Focus session controller
   ========================================================================== */
const FocusSession = {
  tickTimer: null, checkinTimer: null, minimised: false,

  active(){ return !!state.activeFocus; },

  start(opts){
    const f = state.settings.focus;
    const plannedMin = opts.plannedMin || f.duration;
    state.activeFocus = {
      id: uid('fs'),
      startedAt: new Date().toISOString(),
      phase: 'focus',
      plannedMin,
      breakMin: f.breakMin,
      phaseEndsAt: Date.now() + plannedMin*60000,
      pausedAt: null,
      accumulatedSec: 0,
      round: 1,
      taskId: opts.taskId || '',
      projectId: opts.projectId || '',
      intent: opts.intent || '',
      lastBeat: Date.now()
    };
    markDirty();
    FocusAudio.start(f.ambience, f.companion);
    this.openRoom();
    this.startTimers();
    FocusAudio.chime('focus');
  },

  resumeExisting(){
    const a = state.activeFocus;
    if(!a) return;
    if(a.pausedAt){ a.pausedAt = Date.now(); }
    FocusAudio.start(state.settings.focus.ambience, state.settings.focus.companion);
    this.openRoom();
    this.startTimers();
  },

  startTimers(){
    clearInterval(this.tickTimer);
    this.tickTimer = setInterval(()=> this.tick(), 500);
    this.scheduleCheckin();
  },

  scheduleCheckin(){
    clearTimeout(this.checkinTimer);
    const delay = 150000 + Math.random()*180000; // every 2.5–5.5 min
    this.checkinTimer = setTimeout(()=>{
      if(this.active() && !state.activeFocus.pausedAt && state.activeFocus.phase === 'focus'){
        this.showCheckin(CHECKIN_LINES[Math.floor(Math.random()*CHECKIN_LINES.length)]);
      }
      this.scheduleCheckin();
    }, delay);
  },

  showCheckin(text){
    const el = document.getElementById('companion-note');
    if(!el) return;
    el.innerHTML = `<span class="cn-who">${escapeHtml(state.settings.focus.partnerName)}</span> · ${escapeHtml(text)}`;
    el.classList.add('show');
    clearTimeout(this._noteTimer);
    this._noteTimer = setTimeout(()=> el.classList.remove('show'), 7000);
  },

  remainingSec(){
    const a = state.activeFocus;
    if(!a) return 0;
    if(a.pausedAt) return Math.max(0, Math.round((a.phaseEndsAt - a.pausedAt)/1000));
    return Math.max(0, Math.round((a.phaseEndsAt - Date.now())/1000));
  },

  tick(){
    const a = state.activeFocus;
    if(!a) return;
    if(!a.pausedAt && a.phase === 'focus'){
      const now = Date.now();
      a.accumulatedSec += (now - a.lastBeat)/1000;
      a.lastBeat = now;
      if(Math.floor(a.accumulatedSec) % 15 === 0) scheduleSave();
    } else {
      a.lastBeat = Date.now();
    }
    this.paint();
    if(this.remainingSec() <= 0) this.phaseComplete();
  },

  phaseComplete(){
    const a = state.activeFocus;
    if(!a) return;
    if(a.phase === 'focus'){
      this.logSession(true);
      FocusAudio.chime('break');
      a.phase = 'break';
      a.phaseEndsAt = Date.now() + (a.breakMin||5)*60000;
      a.lastBeat = Date.now();
      FocusAudio.stopTyping();
      this.showCheckin('That is a round done. Stretch, water, look out of a window — back in ' + (a.breakMin||5) + '.');
      markDirty();
      this.paint();
    } else {
      FocusAudio.chime('focus');
      a.phase = 'focus';
      a.round += 1;
      a.plannedMin = state.settings.focus.duration;
      a.phaseEndsAt = Date.now() + a.plannedMin*60000;
      a.accumulatedSec = 0;
      a.lastBeat = Date.now();
      if(state.settings.focus.companion) FocusAudio.startTyping();
      this.showCheckin('Round ' + a.round + '. I am back at my desk — starting now.');
      markDirty();
      this.paint();
    }
  },

  togglePause(){
    const a = state.activeFocus;
    if(!a) return;
    if(a.pausedAt){
      const pausedFor = Date.now() - a.pausedAt;
      a.phaseEndsAt += pausedFor;
      a.pausedAt = null;
      a.lastBeat = Date.now();
      FocusAudio.start(state.settings.focus.ambience, state.settings.focus.companion);
    } else {
      a.pausedAt = Date.now();
      FocusAudio.stopAll();
    }
    markDirty();
    this.paint();
  },

  extend(min){
    const a = state.activeFocus;
    if(!a) return;
    a.phaseEndsAt += min*60000;
    if(a.phase === 'focus') a.plannedMin += min;
    markDirty();
    this.paint();
  },

  logSession(completed){
    const a = state.activeFocus;
    if(!a) return;
    const focusedSec = Math.round(a.accumulatedSec);
    if(focusedSec < 30) return; // ignore accidental starts
    state.focusSessions.push({
      id: a.id + '-r' + a.round,
      startedAt: a.startedAt,
      endedAt: new Date().toISOString(),
      plannedMin: a.plannedMin,
      focusedSec,
      taskId: a.taskId,
      projectId: a.projectId,
      intent: a.intent,
      completed: !!completed,
      ambience: state.settings.focus.ambience,
      scene: state.settings.focus.scene
    });
    if(a.projectId) touchProject(a.projectId);
  },

  end(){
    if(!this.active()) return;
    if(state.activeFocus.phase === 'focus') this.logSession(false);
    const summary = { focusedSec: Math.round(state.activeFocus.accumulatedSec), rounds: state.activeFocus.round, intent: state.activeFocus.intent };
    state.activeFocus = null;
    clearInterval(this.tickTimer);
    clearTimeout(this.checkinTimer);
    FocusAudio.stopAll();
    this.closeRoom();
    markDirty();
    if(summary.focusedSec >= 30){
      toast('Focus logged: ' + Math.round(summary.focusedSec/60) + ' min across ' + summary.rounds + ' round' + (summary.rounds===1?'':'s') + '.');
    }
  },

  /* --- room / pill plumbing --- */
  openRoom(){
    this.minimised = false;
    const root = document.getElementById('focus-room-root');
    root.innerHTML = focusRoomHTML();
    document.body.style.overflow = 'hidden';
    document.body.classList.add('room-open');
    FocusVisuals.attach(document.getElementById('focus-canvas'));
    this.renderPill();
    this.paint();
  },

  closeRoom(){
    const root = document.getElementById('focus-room-root');
    root.innerHTML = '';
    document.body.style.overflow = '';
    document.body.classList.remove('room-open');
    FocusVisuals.detach();
    this.renderPill();
  },

  minimise(){
    this.minimised = true;
    const root = document.getElementById('focus-room-root');
    root.innerHTML = '';
    document.body.style.overflow = '';
    document.body.classList.remove('room-open');
    FocusVisuals.detach();
    this.renderPill();
    render();
  },

  renderPill(){
    const root = document.getElementById('focus-pill-root');
    if(!root) return;
    const a = state.activeFocus;
    const showPill = a && this.minimised;
    if(!showPill){ root.innerHTML = ''; return; }
    root.innerHTML = `<div class="focus-pill ${a.pausedAt?'paused':''}" data-action="focus-reopen" role="button" tabindex="0"
        title="Return to the Focus Room">
      <span class="presence-dot"></span>
      <span>
        <span class="fp-time">${fmtClock(this.remainingSec())}</span>
        <span class="fp-label">${a.pausedAt ? 'paused' : (a.phase==='break'?'break':'focus')}</span>
      </span>
      <button class="btn xs ghost" data-action="focus-toggle-pause" aria-label="${a.pausedAt?'Resume':'Pause'} session">${a.pausedAt?'▶':'❙❙'}</button>
      <button class="btn xs ghost" data-action="focus-end" aria-label="End session">Stop</button>
    </div>`;
  },

  /* Only repaint the numbers/ring — cheap enough to run twice a second. */
  paint(){
    const a = state.activeFocus;
    if(!a) return;
    if(this.minimised){ this.renderPill(); return; }
    const timeEl = document.getElementById('focus-time');
    if(!timeEl) return;
    const remaining = this.remainingSec();
    timeEl.textContent = fmtClock(remaining);
    const totalSec = (a.phase === 'focus' ? a.plannedMin : (a.breakMin||5)) * 60;
    const pct = totalSec > 0 ? clamp(1 - remaining/totalSec, 0, 1) : 0;
    const ring = document.getElementById('focus-ring-progress');
    if(ring){
      const c = 2*Math.PI*138;
      ring.setAttribute('stroke-dasharray', c.toFixed(1));
      ring.setAttribute('stroke-dashoffset', (c*(1-pct)).toFixed(1));
      ring.setAttribute('stroke', a.phase === 'break' ? 'var(--signal)' : 'var(--accent)');
    }
    const phaseEl = document.getElementById('focus-phase');
    if(phaseEl){
      phaseEl.textContent = a.pausedAt ? 'Paused' : (a.phase === 'break' ? 'Break · round ' + a.round : 'Focus · round ' + a.round);
      phaseEl.classList.toggle('break', a.phase === 'break');
    }
    const breathEl = document.getElementById('focus-breath');
    if(breathEl){
      breathEl.textContent = (state.settings.focus.scene === 'breathe' && !a.pausedAt) ? FocusVisuals.breathPhase : '';
    }
    const stateEl = document.getElementById('partner-state');
    if(stateEl){
      stateEl.textContent = a.pausedAt ? 'waiting for you' : (a.phase === 'break' ? 'on a break too' : 'heads down, working');
    }
    const dots = document.getElementById('partner-typing');
    if(dots) dots.classList.toggle('idle', !!a.pausedAt || a.phase === 'break' || !state.settings.focus.companion);
    const pauseBtn = document.getElementById('focus-pause-btn');
    if(pauseBtn) pauseBtn.textContent = a.pausedAt ? '▶ Resume' : '❙❙ Pause';
  }
};

function fmtClock(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* Sound/scene chips live in two places (tab + room). Sync them in place rather
   than re-rendering, so a running session's canvas and audio are untouched. */
function refreshFocusChips(){
  const f = state.settings.focus;
  const sync = (sel, isOn)=> document.querySelectorAll(sel).forEach(b=>{
    const on = isOn(b);
    b.classList.toggle('active', on);
    if(b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', String(on));
  });
  sync('[data-action="focus-set-ambience"]', b=> b.dataset.id === f.ambience);
  sync('[data-action="focus-set-scene"]', b=> b.dataset.id === f.scene);
  sync('[data-action="focus-set-duration"]', b=> Number(b.dataset.min) === f.duration);
  sync('[data-action="focus-toggle-companion"]', ()=> !!f.companion);
  sync('[data-action="focus-toggle-mute"]', ()=> FocusAudio.muted);
  document.querySelectorAll('.room-chip-row [data-action="focus-toggle-mute"]').forEach(b=>{
    b.textContent = FocusAudio.muted ? '🔇 Muted' : '🔊 Sound on';
    b.setAttribute('aria-label', FocusAudio.muted ? 'Unmute sound' : 'Mute sound');
  });
  if(currentTab === 'focus' && !FocusSession.active()) renderFocus();
}

/* ==========================================================================
   Focus stats
   ========================================================================== */
function focusSecondsOn(dateISO){
  return state.focusSessions
    .filter(s=> (s.endedAt||s.startedAt||'').slice(0,10) === dateISO)
    .reduce((sum,s)=> sum + (Number(s.focusedSec)||0), 0);
}
function focusMinutesToday(){ return Math.round(focusSecondsOn(todayISO())/60); }
function focusSessionsToday(){ return state.focusSessions.filter(s=> (s.endedAt||s.startedAt||'').slice(0,10) === todayISO()).length; }
function focusTotalHours(){ return (state.focusSessions.reduce((s,x)=> s + (Number(x.focusedSec)||0), 0)/3600); }
function focusStreakDays(){
  let streak = 0;
  for(let i=0;i<400;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    if(focusSecondsOn(iso) > 0) streak++;
    else if(i > 0) break;               // today not yet counted keeps streak alive
  }
  return streak;
}
function focusLast14Days(){
  const out = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    out.push({ label: String(d.getDate()), value: Math.round(focusSecondsOn(iso)/60), isCurrent: i===0 });
  }
  return out;
}

function render(){
  document.getElementById('business-name-label').textContent = state.settings.businessName || 'Clientflow';
  const modeEl = document.getElementById('storage-mode-label');
  modeEl.textContent = storageMode==='fsa' ? 'Linked File' : storageMode==='idb' ? 'Browser Storage' : 'Clientflow';
  const saveBtn = document.getElementById('save-file-btn');
  if(storageMode === 'idb'){
    saveBtn.textContent = '⬇ Export Backup';
    saveBtn.title = 'Download a JSON backup of all your data';
  } else {
    saveBtn.textContent = 'Save File';
    saveBtn.title = 'Write to your linked data file now';
  }
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===currentTab));
  document.querySelectorAll('.view').forEach(v=> v.classList.toggle('active', v.dataset.view===currentTab));
  switch(currentTab){
    case 'dashboard': renderDashboard(); break;
    case 'projects': renderProjects(); break;
    case 'clients': renderClients(); break;
    case 'invoices': renderInvoices(); break;
    case 'focus': renderFocus(); break;
    case 'settings': renderSettings(); break;
  }
}
function switchTab(tab){ currentTab = tab; render(); }

/* Canvas charts are drawn at a fixed pixel size, so they must be redrawn when
   the window (and therefore their CSS size) changes. */
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ if(storageMode) render(); }, 150);
});

function finishInit(){
  render();
  // A session left running (tab closed, crash, accidental reload) is offered
  // back rather than silently losing the time already logged.
  if(state.activeFocus){
    const a = state.activeFocus;
    const staleHours = (Date.now() - new Date(a.startedAt).getTime())/3600000;
    if(staleHours > 12){
      FocusSession.logSession(false);
      state.activeFocus = null;
      scheduleSave();
    } else {
      a.lastBeat = Date.now();
      if(a.phaseEndsAt <= Date.now()){
        FocusSession.logSession(true);
        state.activeFocus = null;
        scheduleSave();
        toast('Your focus session finished while you were away — it has been logged.');
      } else {
        FocusSession.minimised = true;
        showResumeBanner();
      }
    }
  }
}

/* ==========================================================================
   Event delegation — actions, forms, changes
   ========================================================================== */
document.addEventListener('click', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch(action){
    case 'switch-tab': switchTab(target.dataset.tab); break;
    case 'set-projects-filter': projectsFilter = target.dataset.filter; renderProjects(); break;
    case 'set-projects-view': projectsViewMode = target.dataset.mode; renderProjects(); break;
    case 'sort-projects': {
      const key = target.dataset.key;
      if(projectsSort.key===key) projectsSort.dir = projectsSort.dir==='asc'?'desc':'asc';
      else projectsSort = { key, dir:'asc' };
      renderProjectsContent();
      break;
    }
    case 'set-clients-filter': clientsFilter = target.dataset.filter; renderClients(); break;
    case 'toggle-client-detail': expandedClientId = (expandedClientId===id) ? null : id; renderClients(); break;
    case 'set-invoices-filter': invoicesFilter = target.dataset.filter; renderInvoices(); break;

    case 'open-add-client': openAddClientModal(); break;
    case 'open-edit-client': openEditClientModal(id); break;
    case 'toggle-archive-client': toggleArchiveClient(id); markDirty(); break;

    case 'open-add-project': openAddProjectModal(); break;
    case 'open-edit-project': openEditProjectModal(id); break;
    case 'open-project': openProjectDrawer(id); break;
    case 'toggle-archive-project': {
      const p = getProject(id);
      if(p){ p.status = p.status==='Archived' ? 'Active' : 'Archived'; touchProject(id); markDirty(); refreshProjectDrawerIfOpen(id); }
      break;
    }

    case 'open-add-invoice': openAddInvoiceModal(target.dataset.projectId, target.dataset.clientId); break;
    case 'open-edit-invoice': openEditInvoiceModal(id); break;
    case 'mark-invoice-paid': markInvoicePaid(id); markDirty(); break;
    case 'delete-invoice': if(confirm('Delete this invoice? This cannot be undone.')){ deleteInvoice(id); markDirty(); } break;
    case 'export-invoices-csv': exportInvoicesCSV(); break;

    case 'toggle-task': {
      // Checkbox inputs are toggled via the 'change' listener below to avoid double-firing.
      if(target.tagName === 'INPUT') break;
      const pid = getTaskProjectId(id);
      toggleTask(id); markDirty(); refreshProjectDrawerIfOpen(pid);
      break;
    }
    case 'delete-task': { const pid = getTaskProjectId(id); deleteTask(id); markDirty(); refreshProjectDrawerIfOpen(pid); break; }

    case 'pick-swatch': {
      const wrap = target.parentElement;
      wrap.querySelectorAll('.swatch').forEach(s=> s.classList.remove('selected'));
      target.classList.add('selected');
      const form = target.closest('form');
      if(form) form.querySelector('input[name=colourTag]').value = target.dataset.swatch;
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'close-drawer': closeDrawer(); break;

    case 'save-now': saveNow(); break;
    case 'reconnect-file': reconnectFile(); break;
    case 'dismiss-reconnect': dismissReconnect(); break;
    case 'onboard-create-file': onboardCreateFile(); break;
    case 'onboard-open-file': onboardOpenFile(); break;
    case 'onboard-use-browser': onboardUseBrowser(); break;
    case 'link-file-create': linkNewFileFromSettings('create'); break;
    case 'link-file-open': linkNewFileFromSettings('open'); break;
    case 'export-json': downloadJSON('Clientflow-Data.json', state); toast('Data exported.'); break;
    case 'trigger-import': document.getElementById('import-file-input').click(); break;
    /* --- Focus Room --- */
    case 'focus-start': {
      const sel = document.getElementById('focus-task-select');
      const intentInput = document.getElementById('focus-intent-input');
      const taskId = sel ? sel.value : (focusSetup.taskId === '__free' ? '' : focusSetup.taskId);
      const typed = intentInput ? intentInput.value.trim() : focusSetup.intent;
      const task = taskId ? state.tasks.find(t=>t.id===taskId) : null;
      const intent = typed || (task ? task.title : 'Focus session');
      FocusSession.start({ taskId, projectId: task ? task.projectId : '', intent });
      focusSetup = { taskId: '', intent: '' };
      break;
    }
    case 'focus-start-task': {
      const task = state.tasks.find(t=>t.id===id);
      if(!task) break;
      FocusSession.start({ taskId: task.id, projectId: task.projectId, intent: task.title });
      break;
    }
    case 'focus-set-duration': {
      state.settings.focus.duration = parseInt(target.dataset.min,10);
      scheduleSave();
      refreshFocusChips();
      break;
    }
    case 'focus-set-ambience': {
      state.settings.focus.ambience = target.dataset.id;
      if(FocusSession.active() && !state.activeFocus.pausedAt) FocusAudio.start(target.dataset.id, state.settings.focus.companion);
      scheduleSave();
      refreshFocusChips();
      break;
    }
    case 'focus-set-scene': {
      state.settings.focus.scene = target.dataset.id;
      scheduleSave();
      refreshFocusChips();
      break;
    }
    case 'focus-toggle-companion': {
      const on = !state.settings.focus.companion;
      state.settings.focus.companion = on;
      if(FocusSession.active() && !state.activeFocus.pausedAt){
        if(on) FocusAudio.startTyping(); else FocusAudio.stopTyping();
      }
      scheduleSave();
      refreshFocusChips();
      break;
    }
    case 'focus-toggle-mute': {
      FocusAudio.setMuted(!FocusAudio.muted);
      refreshFocusChips();
      break;
    }
    case 'focus-toggle-pause': FocusSession.togglePause(); break;
    case 'focus-extend': FocusSession.extend(parseInt(target.dataset.min,10) || 5); break;
    case 'focus-minimise': FocusSession.minimise(); break;
    case 'focus-reopen': {
      if(e.target.closest('[data-action="focus-toggle-pause"], [data-action="focus-end"]')) break;
      FocusSession.openRoom();
      break;
    }
    case 'focus-end': FocusSession.end(); render(); break;
    case 'focus-resume-session': FocusSession.resumeExisting(); clearResumeBanner(); break;
    case 'focus-discard-session': {
      FocusSession.logSession(false);
      state.activeFocus = null;
      markDirty();
      clearResumeBanner();
      break;
    }

    case 'open-clear-data': openClearDataModal(); break;
    case 'confirm-clear-data': {
      state = defaultState();
      markDirty();
      closeModal();
      toast('All data cleared.');
      break;
    }
  }
});

function getTaskProjectId(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  return t ? t.projectId : null;
}

document.addEventListener('change', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  if(action==='toggle-task'){
    toggleTask(target.dataset.id);
    markDirty();
    refreshProjectDrawerIfOpen(getTaskProjectId(target.dataset.id));
  } else if(action==='toggle-currency'){
    const cur = target.dataset.currency;
    const idx = state.settings.activeCurrencies.indexOf(cur);
    if(target.checked && idx===-1) state.settings.activeCurrencies.push(cur);
    if(!target.checked && idx!==-1){
      if(state.settings.activeCurrencies.length<=1){ target.checked = true; return; }
      state.settings.activeCurrencies.splice(idx,1);
      if(state.settings.defaultCurrency===cur) state.settings.defaultCurrency = state.settings.activeCurrencies[0];
    }
    markDirty();
  }
});

document.addEventListener('keydown', (e)=>{
  if(e.key === ' ' && FocusSession.active() && !FocusSession.minimised && e.target === document.body){
    e.preventDefault();
    FocusSession.togglePause();
    return;
  }
  if(e.key !== 'Escape') return;
  if(document.getElementById('modal-root').firstChild){ closeModal(); return; }
  if(document.getElementById('drawer-root').firstChild){ closeDrawer(); return; }
  // Escape leaves the room but keeps the clock running.
  if(FocusSession.active() && !FocusSession.minimised) FocusSession.minimise();
});

document.addEventListener('input', (e)=>{
  const vol = e.target.closest('[data-action="focus-volume"]');
  if(vol){
    state.settings.focus.volume = parseFloat(vol.value);
    FocusAudio.applyVolume();
    scheduleSave();
    const pct = vol.parentElement.querySelector('.mono');
    if(pct) pct.textContent = Math.round(state.settings.focus.volume*100) + '%';
    return;
  }
  const intent = e.target.closest('[data-action="focus-type-intent"]');
  if(intent) focusSetup.intent = intent.value;
});

document.addEventListener('change', (e)=>{
  const sel = e.target.closest('[data-action="focus-pick-task"]');
  if(sel) focusSetup.taskId = sel.value || '__free';
});

document.getElementById('import-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(confirm('Import will replace all current data with the contents of this backup. Continue?')){
      state = mergeState(parsed);
      markDirty();
      toast('Data imported.');
    }
  }catch(err){ toast('Could not read that file — is it a valid Clientflow backup?', 'error'); }
  e.target.value = '';
});

document.addEventListener('submit', (e)=>{
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);
  const val = (name)=> fd.get(name);

  if(type==='save-client'){
    const id = form.dataset.id;
    const data = { name: val('name'), company: val('company'), email: val('email'), phone: val('phone'), currency: val('currency'), colourTag: val('colourTag'), notes: val('notes') };
    if(id){ updateClient(id, data); toast('Client updated.'); }
    else { addClient(data); toast('Client created.'); }
    closeModal(); markDirty();
  } else if(type==='save-project'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), name: val('name'), status: val('status'), startDate: val('startDate'), dueDate: val('dueDate'), value: parseFloat(val('value'))||0, currency: val('currency'), description: val('description') };
    if(id){ updateProject(id, data); toast('Project updated.'); refreshProjectDrawerIfOpen(id); }
    else { addProject(data); toast('Project created.'); }
    closeModal(); markDirty();
  } else if(type==='edit-project'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), name: val('name'), status: val('status'), startDate: val('startDate'), dueDate: val('dueDate'), value: parseFloat(val('value'))||0, currency: val('currency'), description: val('description'), notes: val('notes') };
    updateProject(id, data);
    toast('Saved.');
    markDirty();
    refreshProjectDrawerIfOpen(id);
  } else if(type==='save-invoice'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), projectId: val('projectId')||'', invoiceNumber: val('invoiceNumber'), amount: parseFloat(val('amount'))||0, currency: val('currency'), issueDate: val('issueDate'), dueDate: val('dueDate'), status: val('status') };
    if(data.status==='Paid') data.paidDate = todayISO();
    if(id){ updateInvoice(id, data); toast('Invoice updated.'); }
    else { addInvoice(data); toast('Invoice created.'); }
    closeModal(); markDirty();
    refreshProjectDrawerIfOpen(data.projectId);
  } else if(type==='add-task'){
    const projectId = form.dataset.projectId;
    addTask(projectId, { title: val('title'), dueDate: val('dueDate'), priority: val('priority') });
    form.reset();
    markDirty();
    refreshProjectDrawerIfOpen(projectId);
  } else if(type==='settings-focus'){
    const f = state.settings.focus;
    f.partnerName = (val('partnerName')||'').trim() || 'Mo';
    f.breakMin = clamp(parseInt(val('breakMin'),10)||5, 1, 60);
    f.duration = clamp(parseInt(val('duration'),10)||25, 5, 180);
    f.chimes = !!fd.get('chimes');
    toast('Focus settings saved.');
    markDirty();
  } else if(type==='settings-business'){
    state.settings.businessName = val('businessName');
    state.settings.defaultCurrency = val('defaultCurrency');
    state.settings.financialYearStart = parseInt(val('financialYearStart'),10);
    toast('Settings saved.');
    markDirty();
  }
});

/* ==========================================================================
   Boot
   ========================================================================== */
initStorage();

</script>
</body>
</html>
