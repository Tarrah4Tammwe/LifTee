<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clientflow — Client &amp; Project Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Clientflow — offline-first client and project tracker for solo service businesses. No login, no subscription, your data stays on your device." />
<style>
/* ==========================================================================
   Clientflow — Neon Draft theme
   ========================================================================== */
:root{
  --bg:       #0A0E1A;
  --bg2:      #111827;
  --bg3:      #1A2235;
  --border:   rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --accent:   #F0187A;
  --accent2:  #C8106A;
  --signal:   #A3E635;
  --amber:    #FB923C;
  --green:    #A3E635;
  --red:      #F87171;
  --text:     #F8FAFC;
  --text-dim: rgba(248,250,252,0.5);
  --text-dim2:rgba(248,250,252,0.32);

  --font-display: 'Cabinet Grotesk', 'Space Grotesk', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
  --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-glow-accent: 0 0 0 1px rgba(240,24,122,0.35), 0 0 24px rgba(240,24,122,0.25);
  --shadow-glow-green: 0 0 0 1px rgba(163,230,53,0.3), 0 0 18px rgba(163,230,53,0.18);
  --shadow-glow-amber: 0 0 0 1px rgba(251,146,60,0.3), 0 0 18px rgba(251,146,60,0.18);
  --shadow-glow-red: 0 0 0 1px rgba(248,113,113,0.32), 0 0 18px rgba(248,113,113,0.2);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: radial-gradient(1200px 800px at 15% -10%, rgba(240,24,122,0.10), transparent 60%),
              radial-gradient(1000px 700px at 100% 0%, rgba(163,230,53,0.06), transparent 55%),
              var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
button{ font-family: inherit; }
a{ color: var(--accent); }
::selection{ background: var(--accent); color: var(--bg); }

.mono{ font-family: var(--font-mono); }
.dim{ color: var(--text-dim); }
.hidden{ display:none !important; }
.scroll-x{ overflow-x:auto; }

/* Scrollbars */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--bg3); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background: var(--border-strong); }

/* ---------------------------------- Layout ---------------------------------- */
#app{ min-height:100%; display:flex; flex-direction:column; }

header.topbar{
  position: sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:18px;
  padding: 12px 20px;
  background: rgba(10,14,26,0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand{ display:flex; align-items:center; gap:10px; margin-right:6px; }
.brand-mark{
  width:30px; height:30px; border-radius:9px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: var(--shadow-glow-accent);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight:800; color:#fff; font-size:15px;
  flex-shrink:0;
}
.brand-name{ font-family: var(--font-display); font-weight:800; font-size:18px; letter-spacing:-0.02em; }
.brand-sub{ font-size:11px; color:var(--text-dim); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; }

nav.tabs{ display:flex; gap:4px; flex:1; overflow-x:auto; }
nav.tabs button{
  appearance:none; border:1px solid transparent; background:transparent; color: var(--text-dim);
  padding:8px 14px; border-radius: var(--radius-sm); font-size:13.5px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition: color .15s, background .15s, border-color .15s;
}
nav.tabs button:hover{ color: var(--text); background: var(--bg2); }
nav.tabs button.active{ color: var(--text); background: var(--bg3); border-color: var(--border-strong); box-shadow: inset 0 0 0 1px rgba(240,24,122,0.15); }
nav.tabs button.active::after{ content:''; }

.header-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.save-indicator{ font-size:11.5px; font-family: var(--font-mono); color: var(--text-dim2); display:flex; align-items:center; gap:6px; min-width:74px; }
.save-indicator .dot{ width:6px; height:6px; border-radius:50%; background: var(--text-dim2); transition: background .2s; }
.save-indicator.saving .dot{ background: var(--amber); box-shadow:0 0 8px rgba(251,146,60,0.6); }
.save-indicator.saved .dot{ background: var(--green); box-shadow:0 0 8px rgba(163,230,53,0.6); }
.save-indicator.error .dot{ background: var(--red); box-shadow:0 0 8px rgba(248,113,113,0.6); }

/* ---------------------------------- Buttons ---------------------------------- */
.btn{
  appearance:none; border:1px solid var(--border-strong); background: var(--bg2); color: var(--text);
  padding:8px 14px; border-radius: var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition: transform .1s, background .15s, box-shadow .15s, border-color .15s;
  white-space:nowrap;
}
.btn:hover{ background: var(--bg3); border-color: rgba(255,255,255,0.18); }
.btn:active{ transform: translateY(1px); }
.btn.primary{ background: var(--accent); border-color: var(--accent); color:#fff; box-shadow: var(--shadow-glow-accent); }
.btn.primary:hover{ background: var(--accent2); border-color: var(--accent2); }
.btn.ghost{ background: transparent; border-color: var(--border); }
.btn.danger{ background: transparent; border-color: rgba(248,113,113,0.4); color: var(--red); }
.btn.danger:hover{ background: rgba(248,113,113,0.1); }
.btn.sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
.btn.xs{ padding:3px 8px; font-size:11.5px; border-radius:6px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-icon{ width:34px; height:34px; padding:0; justify-content:center; border-radius: var(--radius-sm); }

/* ---------------------------------- Main / Views ---------------------------------- */
main#views{ flex:1; padding: 22px 26px 60px; max-width:1440px; width:100%; margin:0 auto; }
.view{ display:none; animation: fadein .18s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:translateY(0);} }

.view-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.view-header h2{ font-size:22px; }
.view-header .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.filter-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.filter-tabs button{
  appearance:none; border:1px solid var(--border); background: var(--bg2); color: var(--text-dim);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; transition: all .15s;
}
.filter-tabs button:hover{ color:var(--text); }
.filter-tabs button.active{ background: var(--bg3); color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 1px rgba(240,24,122,0.25); }

/* ---------------------------------- Cards / Panels ---------------------------------- */
.card{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-md); padding:16px; }
.panel{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-lg); padding:18px; }
.panel-title{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--text-dim); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }

/* KPI strip */
.kpi-strip{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:18px; }
.kpi-card{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-lg); padding:16px 18px; position:relative; overflow:hidden; }
.kpi-card::before{ content:''; position:absolute; top:0; left:0; width:3px; height:100%; background: var(--accent); opacity:.7; }
.kpi-card.amber::before{ background: var(--amber); }
.kpi-card .kpi-label{ font-size:11.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:8px; }
.kpi-card .kpi-value{ font-family: var(--font-display); font-size:26px; font-weight:800; }
.kpi-card .kpi-value.mono{ font-family: var(--font-mono); }
.kpi-card.amber .kpi-value{ color: var(--amber); }
.kpi-card .kpi-sub{ font-size:11.5px; color: var(--text-dim2); margin-top:4px; }

/* Charts row */
.charts-row{ display:grid; grid-template-columns: 2fr 1fr 1fr; gap:14px; margin-bottom:18px; }
.chart-card{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-lg); padding:16px; position:relative; }
.chart-card h3{ font-size:13.5px; font-weight:700; margin-bottom:10px; }
.chart-wrap{ position:relative; height:190px; }
.chart-wrap canvas{ width:100%; height:100%; display:block; }
.chart-tooltip{
  position:absolute; pointer-events:none; background: var(--bg3); border:1px solid var(--border-strong);
  padding:6px 10px; border-radius:8px; font-size:11.5px; opacity:0; transform: translate(-50%,-8px); transition: opacity .1s;
  white-space:nowrap; z-index:5; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.chart-tooltip.show{ opacity:1; }
.chart-tooltip .tt-title{ font-weight:700; }
.chart-tooltip .tt-val{ font-family: var(--font-mono); color: var(--signal); }
.donut-legend{ display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:12px; }
.donut-legend .leg-row{ display:flex; align-items:center; gap:8px; justify-content:space-between; }
.donut-legend .leg-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.donut-legend .leg-name{ display:flex; align-items:center; gap:8px; color: var(--text-dim); }
.donut-legend .leg-count{ font-family: var(--font-mono); font-weight:700; }
.chart-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color: var(--text-dim2); pointer-events:none; }

/* Status pills */
.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; border:1px solid transparent; }
.pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
.pill.muted{ background: rgba(255,255,255,0.06); color: var(--text-dim); }
.pill.muted::before{ background: var(--text-dim); }
.pill.accent{ background: rgba(240,24,122,0.14); color: #ff6bb0; box-shadow: 0 0 12px rgba(240,24,122,0.18); }
.pill.accent::before{ background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.pill.green{ background: rgba(163,230,53,0.14); color: var(--green); box-shadow: 0 0 12px rgba(163,230,53,0.14); }
.pill.green::before{ background: var(--green); box-shadow: 0 0 6px var(--green); }
.pill.amber{ background: rgba(251,146,60,0.14); color: var(--amber); box-shadow: 0 0 12px rgba(251,146,60,0.14); }
.pill.amber::before{ background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.pill.red{ background: rgba(248,113,113,0.14); color: var(--red); box-shadow: 0 0 12px rgba(248,113,113,0.14); }
.pill.red::before{ background: var(--red); box-shadow: 0 0 6px var(--red); }
.pill.dim{ background: rgba(255,255,255,0.03); color: var(--text-dim2); }
.pill.dim::before{ background: var(--text-dim2); }

/* Attention / week panels */
.two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:18px; }
.attn-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.attn-item:last-child{ border-bottom:none; }
.attn-item .attn-main{ flex:1; min-width:0; }
.attn-item .attn-title{ font-weight:600; font-size:13px; }
.attn-item .attn-sub{ font-size:11.5px; color: var(--text-dim); margin-top:2px; }
.empty-state{ text-align:center; padding: 28px 10px; color: var(--text-dim2); font-size:13px; }
.empty-state .es-icon{ font-size:26px; margin-bottom:8px; opacity:.6; }

.week-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.week-item:last-child{ border-bottom:none; }
.week-item input[type=checkbox]{ width:17px; height:17px; accent-color: var(--green); cursor:pointer; flex-shrink:0; }
.week-item .wk-main{ flex:1; min-width:0; }
.week-item .wk-title{ font-size:13px; font-weight:600; }
.week-item.done .wk-title{ text-decoration:line-through; color: var(--text-dim2); }
.week-item .wk-sub{ font-size:11.5px; color: var(--text-dim); }

/* Active projects strip */
.proj-strip{ display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
.mini-card{ min-width:210px; background: var(--bg3); border:1px solid var(--border); border-radius: var(--radius-md); padding:14px; cursor:pointer; transition: border-color .15s, transform .1s; flex-shrink:0; }
.mini-card:hover{ border-color: var(--border-strong); transform: translateY(-2px); }
.mini-card .mc-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.color-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow: 0 0 6px currentColor; }
.mini-card .mc-name{ font-weight:700; font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini-card .mc-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.mini-card .mc-due{ font-size:11.5px; color: var(--text-dim); font-family: var(--font-mono); }
.mini-card .mc-due.overdue{ color: var(--red); font-weight:700; }

.quick-add{ display:flex; gap:10px; flex-wrap:wrap; }

/* progress ring */
.progress-ring{ display:block; flex-shrink:0; }
.progress-ring .ring-label{ font-family: var(--font-mono); font-size:10px; fill: var(--text); font-weight:700; }

/* ---------------------------------- Kanban ---------------------------------- */
.kanban-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.view-toggle{ display:flex; border:1px solid var(--border); border-radius: var(--radius-sm); overflow:hidden; }
.view-toggle button{ appearance:none; border:none; background: var(--bg2); color: var(--text-dim); padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
.view-toggle button.active{ background: var(--accent); color:#fff; }

.kanban-board{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; align-items:start; }
.kanban-col{ background: rgba(255,255,255,0.015); border:1px solid var(--border); border-radius: var(--radius-lg); padding:12px; min-height:140px; transition: background .15s, border-color .15s; }
.kanban-col.drag-over{ background: rgba(240,24,122,0.06); border-color: var(--accent); }
.kanban-col-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding: 0 2px; }
.kanban-col-head h4{ font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color: var(--text-dim); }
.kanban-count{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim2); background: var(--bg3); padding:2px 7px; border-radius:999px; }
.kanban-cards{ display:flex; flex-direction:column; gap:10px; min-height:60px; }

.project-card{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-md); padding:13px; cursor:pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
.project-card:hover{ border-color: var(--border-strong); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
.project-card.dragging{ opacity:.4; }
.pc-top{ display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.pc-client{ font-size:11.5px; color: var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc-name{ font-weight:700; font-size:14px; margin-bottom:8px; }
.pc-mid{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
.pc-value{ font-family: var(--font-mono); font-size:13px; font-weight:700; color: var(--signal); }
.pc-timeline{ margin-bottom:8px; }
.pc-due{ font-size:11px; font-family: var(--font-mono); color: var(--text-dim); }
.pc-due.overdue{ color: var(--red); font-weight:700; }

/* ---------------------------------- Tables ---------------------------------- */
table.data-table{ width:100%; border-collapse: collapse; font-size:13px; }
table.data-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color: var(--text-dim); padding:10px 12px; border-bottom:1px solid var(--border-strong); cursor:pointer; user-select:none; white-space:nowrap; }
table.data-table th:hover{ color: var(--text); }
table.data-table td{ padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.data-table tbody tr{ transition: background .12s; }
table.data-table tbody tr.clickable{ cursor:pointer; }
table.data-table tbody tr.clickable:hover{ background: var(--bg2); }
table.data-table tbody tr.expanded-row{ background: var(--bg2); }
.table-wrap{ background: var(--bg2); border:1px solid var(--border); border-radius: var(--radius-lg); overflow:hidden; }
.table-wrap table.data-table{ background:transparent; }
.table-wrap .table-scroll{ overflow-x:auto; }
.name-cell{ display:flex; align-items:center; gap:8px; font-weight:600; }
.actions-cell{ display:flex; gap:6px; }

.detail-row td{ background: rgba(255,255,255,0.015); border-bottom:1px solid var(--border-strong); padding:0; }
.detail-row .detail-inner{ padding:18px 24px; }

/* ---------------------------------- Modals / Drawer ---------------------------------- */
.overlay{ position:fixed; inset:0; background: rgba(4,6,12,0.68); backdrop-filter: blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; animation: fadeinbg .12s ease; }
@keyframes fadeinbg{ from{opacity:0;} to{opacity:1;} }
.modal{ background: var(--bg2); border:1px solid var(--border-strong); border-radius: var(--radius-lg); width:100%; max-width:520px; max-height:88vh; overflow:auto; box-shadow: 0 30px 80px rgba(0,0,0,.55); animation: popin .14s ease; }
.modal.wide{ max-width:760px; }
@keyframes popin{ from{opacity:0; transform: scale(.97) translateY(6px);} to{opacity:1; transform: scale(1) translateY(0);} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background: var(--bg2); z-index:2; }
.modal-head h3{ font-size:17px; }
.modal-body{ padding:20px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background: var(--bg2); }

.drawer-overlay{ position:fixed; inset:0; background: rgba(4,6,12,0.6); z-index:100; }
.drawer{ position:fixed; top:0; right:0; height:100%; width:min(560px, 100%); background: var(--bg2); border-left:1px solid var(--border-strong); box-shadow: -20px 0 60px rgba(0,0,0,.5); z-index:101; overflow-y:auto; transform: translateX(100%); transition: transform .22s ease; }
.drawer.open{ transform: translateX(0); }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background: var(--bg2); z-index:2; }
.drawer-body{ padding:22px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--text-dim); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background: var(--bg3); border:1px solid var(--border); color: var(--text);
  padding:9px 11px; border-radius: var(--radius-sm); font-size:13.5px; font-family: inherit; outline:none;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,24,122,0.14); }
.field textarea{ resize:vertical; min-height:70px; }
.field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.field-row3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
.color-swatches{ display:flex; gap:8px; }
.swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition: transform .1s, border-color .15s; }
.swatch:hover{ transform: scale(1.08); }
.swatch.selected{ border-color: #fff; }

/* ---------------------------------- Misc components ---------------------------------- */
.close-x{ appearance:none; border:none; background: var(--bg3); color: var(--text-dim); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.close-x:hover{ background: var(--border-strong); color: var(--text); }

.task-bar-track{ width:100%; height:8px; border-radius:999px; background: var(--border); overflow:hidden; }
.task-bar-fill{ height:100%; background: var(--green); border-radius:999px; transition: width .2s; box-shadow: 0 0 8px rgba(163,230,53,0.5); }

.task-row{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-left:3px solid var(--text-dim2); background: var(--bg3); border-radius:8px; margin-bottom:8px; padding-left:10px; }
.task-row.priority-high{ border-left-color: var(--red); }
.task-row.priority-medium{ border-left-color: var(--amber); }

.inline-add-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

.inline-add-row select{ background: var(--bg3); border:1px solid var(--border); color: var(--text); padding:8px 10px; border-radius:8px; font-size:12.5px; flex: 0 1 auto; }

.mini-list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }

.spark-bar-wrap{ display:inline-block; vertical-align:middle; }

/* Onboarding */

.onboard-card h1{ font-size:30px; margin-bottom:10px; }

.onboard-options{ display:flex; flex-direction:column; gap:12px; }
.onboard-opt{ display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius: var(--radius-md); border:1px solid var(--border); background: var(--bg2); cursor:pointer; text-align:left; transition: border-color .15s, transform .1s; }
.onboard-opt:hover{ border-color: var(--accent); transform: translateY(-1px); }
.onboard-opt .oo-icon{ font-size:22px; flex-shrink:0; }

/* Toast */
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast{ background: var(--bg3); border:1px solid var(--border-strong); padding:11px 16px; border-radius: var(--radius-sm); font-size:13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: toastin .15s ease; pointer-events:none; }
@keyframes toastin{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }

.settings-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
.currency-toggle-list{ display:flex; flex-direction:column; gap:8px; }

.switch input{ opacity:0; width:0; height:0; }
.switch .slider{ position:absolute; inset:0; background: var(--border-strong); border-radius:999px; cursor:pointer; transition: background .15s; }
.switch .slider::before{ content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background: var(--text); border-radius:50%; transition: transform .15s; }
.switch input:checked + .slider{ background: var(--accent); }
.switch input:checked + .slider::before{ transform: translateX(16px); }

@media (max-width: 1100px){
  .charts-row{ grid-template-columns: 1fr; }
  .kanban-board{ grid-template-columns: repeat(2,1fr); }

  main#views{ padding: 16px 12px 50px; }

}

</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name" id="business-name-label">Clientflow</div>

      </div>
    </div>

</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>
<div id="onboard-root"></div>
<input type="file" id="import-file-input" accept="application/json" class="hidden" />

<script>
"use strict";
/* ==========================================================================
   Clientflow — application script
   ========================================================================== */

/* ---------------------------------- Constants ---------------------------------- */
const COLORS = {
  bg:'#0A0E1A', bg2:'#111827', bg3:'#1A2235', border:'rgba(255,255,255,0.06)',
  accent:'#F0187A', accent2:'#C8106A', signal:'#A3E635', amber:'#FB923C',
  green:'#A3E635', red:'#F87171', text:'#F8FAFC', textDim:'rgba(248,250,252,0.5)'
};
const CURRENCIES = ['GBP','USD','EUR','AUD','CAD'];
const CURRENCY_SYMBOLS = { GBP:'£', USD:'$', EUR:'€', AUD:'A$', CAD:'C$' };
const CLIENT_COLORS = ['#F0187A','#A3E635','#FB923C','#38BDF8','#C084FC','#F87171'];
const PROJECT_STATUSES = ['Prospect','Active','Paused','Complete','Archived'];
const KANBAN_STATUSES = ['Prospect','Active','Paused','Complete'];
const INVOICE_STATUSES = ['Draft','Sent','Paid','Overdue'];
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const DB_NAME = 'clientflow-db';
const DB_VERSION = 1;

/* ---------------------------------- State ---------------------------------- */
function defaultState(){
  return {
    clients: [],
    projects: [],
    tasks: [],
    invoices: [],
    settings: {
      businessName: 'My Business',
      defaultCurrency: 'GBP',
      financialYearStart: 4,
      activeCurrencies: CURRENCIES.slice()
    }
  };
}

let state = defaultState();
let currentTab = 'dashboard';
let db = null;
let fileHandle = null;
let storageMode = null; // 'fsa' | 'idb' | null (not yet chosen)
let saveTimer = null;
let isSaving = false;

let projectsFilter = 'All';
let projectsViewMode = 'kanban'; // kanban | list
let projectsSort = { key: 'dueDate', dir: 'asc' };
let clientsFilter = 'All';
let expandedClientId = null;
let invoicesFilter = 'All';

/* ---------------------------------- Utilities ---------------------------------- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pad2(n){ return String(n).padStart(2,'0'); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseDate(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDate(s){
  const d = parseDate(s);
  if(!d) return '—';
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
}
function fmtDateShort(s){
  const d = parseDate(s);
  if(!d) return '—';
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
function fmtMoney(amount, currency){
  const sym = CURRENCY_SYMBOLS[currency] || '';
  const n = Number(amount)||0;
  return sym + n.toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function shortMoney(amount){
  const n = Number(amount)||0;
  if(Math.abs(n) >= 1000) return (n/1000).toFixed(n%1000===0?0:1)+'k';
  return String(Math.round(n));
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function niceCeil(v){
  if(v<=0) return 10;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const norm = v/base;
  let n;
  if(norm<=1) n=1; else if(norm<=2) n=2; else if(norm<=5) n=5; else n=10;
  return n*base;
}
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(type==='error') el.style.borderColor = 'rgba(248,113,113,0.5)';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 260); }, 2600);
}
function roundRect(ctx,x,y,w,h,r){
  if(w<=0||h<=0){ ctx.beginPath(); return; }
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ==========================================================================
   Storage layer
   navigator.storage.persist() + File System Access API (primary) with
   IndexedDB fallback (mobile / unsupported browsers).
   ========================================================================== */
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if(!d.objectStoreNames.contains('data')) d.createObjectStore('data');
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbGet(store, key){
  return new Promise((resolve, reject)=>{
    if(!db) return resolve(undefined);
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbSet(store, key, val){
  return new Promise((resolve, reject)=>{
    if(!db) return resolve();
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
function idbDelete(store, key){
  return new Promise((resolve, reject)=>{
    if(!db) return resolve();
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

function fsaSupported(){ return 'showSaveFilePicker' in window; }

function mergeState(loaded){
  const base = defaultState();
  if(!loaded || typeof loaded !== 'object') return base;
  return {
    clients: Array.isArray(loaded.clients) ? loaded.clients : [],
    projects: Array.isArray(loaded.projects) ? loaded.projects : [],
    tasks: Array.isArray(loaded.tasks) ? loaded.tasks : [],
    invoices: Array.isArray(loaded.invoices) ? loaded.invoices : [],
    settings: Object.assign(base.settings, loaded.settings || {})
  };
}

async function initStorage(){
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  try{ db = await openDB(); }catch(e){ console.error('IndexedDB unavailable', e); }

  if(fsaSupported()){
    try{
      const savedHandle = await idbGet('meta','fileHandle');
      if(savedHandle){
        fileHandle = savedHandle;
        const perm = await safeQueryPermission(fileHandle);
        if(perm === 'granted'){
          const ok = await loadFromFileHandle();
          if(ok){ storageMode='fsa'; finishInit(); return; }
        } else {
          showReconnectBanner();
        }
      }
    }catch(e){ console.warn('No linked file handle yet', e); }
  }

  try{
    const idbData = await idbGet('data','app');
    if(idbData){
      state = mergeState(idbData);
      storageMode = 'idb';
      finishInit();
      return;
    }
  }catch(e){}

  showOnboarding();
}

async function safeQueryPermission(handle){
  try{ return await handle.queryPermission({ mode: 'readwrite' }); }
  catch(e){ return 'prompt'; }
}
async function safeRequestPermission(handle){
  try{ return await handle.requestPermission({ mode: 'readwrite' }); }
  catch(e){ return 'denied'; }
}

async function loadFromFileHandle(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    const parsed = text.trim() ? JSON.parse(text) : {};
    state = mergeState(parsed);
    return true;
  }catch(e){
    console.error('Failed reading linked file', e);
    toast('Could not read linked data file. Falling back to browser storage.', 'error');
    return false;
  }
}

function showReconnectBanner(){
  const slot = document.getElementById('reconnect-banner-slot');
  slot.innerHTML = `<div class="reconnect-banner">
    <span>🔒 Your linked data file needs to be reconnected after this browser restart.</span>
    <button class="btn xs primary" data-action="reconnect-file">Reconnect File</button>
    <button class="btn xs ghost" data-action="dismiss-reconnect">Use browser storage instead</button>
  </div>`;
}
function clearReconnectBanner(){ document.getElementById('reconnect-banner-slot').innerHTML = ''; }

async function reconnectFile(){
  if(!fileHandle) return;
  const perm = await safeRequestPermission(fileHandle);
  if(perm === 'granted'){
    const ok = await loadFromFileHandle();
    if(ok){
      storageMode = 'fsa';
      clearReconnectBanner();
      render();
      toast('Data file reconnected.');
      return;
    }
  }
  toast('Could not reconnect the file. You can link a new one from Settings.', 'error');
}

async function dismissReconnect(){
  clearReconnectBanner();
  try{
    const idbData = await idbGet('data','app');
    if(idbData){ state = mergeState(idbData); }
  }catch(e){}
  storageMode = 'idb';
  render();
}

function showOnboarding(){
  const root = document.getElementById('onboard-root');
  const supported = fsaSupported();
  root.innerHTML = `
  <div class="onboard-overlay">
    <div class="onboard-card">
      <h1>Welcome to Clientflow</h1>
      <p>Every project, every client, every invoice — in one offline-first tool. Choose how you'd like your data stored. You can change this later in Settings.</p>
      <div class="onboard-options">
        ${supported ? `
        <button class="onboard-opt" data-action="onboard-create-file">
          <span class="oo-icon">📄</span>
          <span><span class="oo-title">Create a new data file</span><br/><span class="oo-sub">Link a Clientflow-Data.json file on your device. Clientflow reads &amp; writes it automatically.</span></span>
        </button>
        <button class="onboard-opt" data-action="onboard-open-file">
          <span class="oo-icon">📂</span>
          <span><span class="oo-title">Open an existing data file</span><br/><span class="oo-sub">Restoring from a previous Clientflow-Data.json backup.</span></span>
        </button>` : ''}
        <button class="onboard-opt" data-action="onboard-use-browser">
          <span class="oo-icon">💾</span>
          <span><span class="oo-title">Continue in browser storage</span><br/><span class="oo-sub">${supported ? 'Skip linking a file — data saves to this browser. Export backups anytime from Settings.' : 'Your browser does not support linked files — data saves locally to this browser. Export backups anytime.'}</span></span>
        </button>
      </div>
    </div>
  </div>`;
}
function hideOnboarding(){ document.getElementById('onboard-root').innerHTML = ''; }

async function onboardCreateFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'Clientflow-Data.json',
      types: [{ description: 'Clientflow Data', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    state = defaultState();
    await idbSet('meta','fileHandle', handle);
    storageMode = 'fsa';
    await doSave(true);
    hideOnboarding();
    finishInit();
    toast('Data file linked. Clientflow will save to it automatically.');
  }catch(e){ if(e && e.name !== 'AbortError') console.error(e); }
}
async function onboardOpenFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Clientflow Data', accept: { 'application/json': ['.json'] } }]
    });
    const perm = await safeRequestPermission(handle);
    if(perm !== 'granted'){ toast('Permission denied for that file.', 'error'); return; }
    fileHandle = handle;
    const ok = await loadFromFileHandle();
    if(!ok) return;
    await idbSet('meta','fileHandle', handle);
    storageMode = 'fsa';
    hideOnboarding();
    finishInit();
    toast('Data file loaded.');
  }catch(e){ if(e && e.name !== 'AbortError') console.error(e); }
}
async function onboardUseBrowser(){
  state = defaultState();
  storageMode = 'idb';
  await idbSet('data','app', state);
  hideOnboarding();
  finishInit();
}

function scheduleSave(){
  setSaveIndicator('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> doSave(false), 450);
}

async function doSave(immediate){
  if(isSaving && !immediate){ return; }
  isSaving = true;
  setSaveIndicator('saving');
  try{
    if(storageMode === 'fsa' && fileHandle){
      const perm = await safeQueryPermission(fileHandle);
      if(perm !== 'granted'){
        const req = await safeRequestPermission(fileHandle);
        if(req !== 'granted') throw new Error('permission-denied');
      }
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(state, null, 2));
      await writable.close();
    } else {
      await idbSet('data','app', state);
    }
    setSaveIndicator('saved');
  }catch(e){
    console.error('Save failed', e);
    setSaveIndicator('error');
    toast('Could not save — check file permissions.', 'error');
  } finally {
    isSaving = false;
  }
}

function setSaveIndicator(status){
  const el = document.getElementById('save-indicator');
  const txt = document.getElementById('save-indicator-text');
  if(!el) return;
  el.classList.remove('saving','saved','error');
  if(status==='saving'){ el.classList.add('saving'); txt.textContent = 'Saving…'; }
  else if(status==='saved'){ el.classList.add('saved'); txt.textContent = 'Saved'; setTimeout(()=>{ if(txt.textContent==='Saved'){ txt.textContent='Ready'; el.classList.remove('saved'); } }, 1800); }
  else if(status==='error'){ el.classList.add('error'); txt.textContent = 'Error'; }
  else { txt.textContent = 'Ready'; }
}

async function saveNow(){
  if(storageMode === 'fsa'){
    await doSave(true);
    toast('Saved to linked file.');
  } else if(storageMode === 'idb'){
    await doSave(true);
    downloadJSON('Clientflow-Data.json', state);
    toast('Backup exported as a download.');
  } else {
    toast('Link a data file first, from Settings.', 'error');
  }
}

function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  downloadBlob(filename, blob);
}
function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

async function linkNewFileFromSettings(mode){
  if(!fsaSupported()){ toast('Your browser does not support linked files.', 'error'); return; }
  try{
    let handle;
    if(mode === 'create'){
      handle = await window.showSaveFilePicker({
        suggestedName: 'Clientflow-Data.json',
        types: [{ description: 'Clientflow Data', accept: { 'application/json': ['.json'] } }]
      });
    } else {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Clientflow Data', accept: { 'application/json': ['.json'] } }] });
      handle = h;
      await safeRequestPermission(handle);
    }
    fileHandle = handle;
    await idbSet('meta','fileHandle', handle);
    storageMode = 'fsa';
    if(mode === 'open'){ await loadFromFileHandle(); }
    await doSave(true);
    render();
    toast('Linked file updated.');
  }catch(e){ if(e && e.name !== 'AbortError') console.error(e); }
}

/* ==========================================================================
   CRUD helpers & computed data
   ========================================================================== */
function markDirty(){ scheduleSave(); render(); }

function touchProject(projectId){
  const p = state.projects.find(x=>x.id===projectId);
  if(p) p.updatedAt = new Date().toISOString();
}

function getClient(id){ return state.clients.find(c=>c.id===id); }
function getProject(id){ return state.projects.find(p=>p.id===id); }
function tasksForProject(id){ return state.tasks.filter(t=>t.projectId===id); }
function invoicesForProject(id){ return state.invoices.filter(i=>i.projectId===id); }
function invoicesForClient(id){ return state.invoices.filter(i=>i.clientId===id); }
function projectsForClient(id){ return state.projects.filter(p=>p.clientId===id); }
function tasksForClient(clientId){
  const projIds = new Set(projectsForClient(clientId).map(p=>p.id));
  return state.tasks.filter(t=>projIds.has(t.projectId));
}

function projectProgress(projectId){
  const tasks = tasksForProject(projectId);
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  return { done, total, pct: total>0 ? done/total : 0 };
}

function effectiveInvoiceStatus(inv){
  if(inv.status === 'Paid') return 'Paid';
  if(inv.dueDate && inv.dueDate < todayISO()) return 'Overdue';
  return inv.status;
}
function syncInvoiceStatuses(){
  state.invoices.forEach(inv=>{
    const eff = effectiveInvoiceStatus(inv);
    if(eff === 'Overdue' && inv.status !== 'Overdue' && inv.status !== 'Paid'){
      inv.status = 'Overdue';
    }
  });
}

function clientColor(client){ return (client && client.colourTag) ? client.colourTag : CLIENT_COLORS[0]; }

function clientTotals(clientId){
  const invs = invoicesForClient(clientId);
  let billed=0, paid=0, outstanding=0;
  invs.forEach(inv=>{
    const amt = Number(inv.amount)||0;
    billed += amt;
    const eff = effectiveInvoiceStatus(inv);
    if(eff==='Paid') paid += amt;
    else if(inv.status !== 'Draft') outstanding += amt;
  });
  return { billed, paid, outstanding };
}

function clientLastActivity(clientId){
  const projs = projectsForClient(clientId);
  let latest = null;
  projs.forEach(p=>{
    const t = p.updatedAt || p.startDate;
    if(t && (!latest || t > latest)) latest = t;
  });
  return latest;
}

function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }

function last6MonthsMeta(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: monthKey(d), label: MONTH_ABBR[d.getMonth()], year: d.getFullYear(), isCurrent: i===0 });
  }
  return months;
}

function monthlyPaidRevenue(currency){
  const months = last6MonthsMeta();
  const map = {};
  months.forEach(m=> map[m.key] = 0);
  state.invoices.forEach(inv=>{
    if(effectiveInvoiceStatus(inv) !== 'Paid') return;
    if(currency && inv.currency !== currency) return;
    const basis = inv.paidDate || inv.dueDate || inv.issueDate;
    if(!basis) return;
    const d = parseDate(basis);
    if(!d) return;
    const key = monthKey(d);
    if(key in map) map[key] += Number(inv.amount)||0;
  });
  return months.map(m=> ({ label: m.label, value: map[m.key], isCurrent: m.isCurrent }));
}

function revenueThisMonth(currency){
  const now = new Date();
  const key = monthKey(now);
  let total = 0;
  state.invoices.forEach(inv=>{
    if(effectiveInvoiceStatus(inv) !== 'Paid') return;
    if(inv.currency !== currency) return;
    const basis = inv.paidDate || inv.dueDate || inv.issueDate;
    const d = parseDate(basis);
    if(d && monthKey(d) === key) total += Number(inv.amount)||0;
  });
  return total;
}

function financialYearRange(fyStartMonth){
  const now = new Date();
  let startYear = now.getFullYear();
  if(now.getMonth()+1 < fyStartMonth) startYear -= 1;
  const start = new Date(startYear, fyStartMonth-1, 1);
  const end = new Date(startYear+1, fyStartMonth-1, 1);
  return { start, end };
}

function revenueThisFinancialYear(currency){
  const { start, end } = financialYearRange(state.settings.financialYearStart || 1);
  let total = 0;
  state.invoices.forEach(inv=>{
    if(effectiveInvoiceStatus(inv) !== 'Paid') return;
    if(inv.currency !== currency) return;
    const basis = inv.paidDate || inv.dueDate || inv.issueDate;
    const d = parseDate(basis);
    if(d && d>=start && d<end) total += Number(inv.amount)||0;
  });
  return total;
}

function outstandingTotal(currency){
  let total = 0;
  state.invoices.forEach(inv=>{
    if(inv.currency !== currency) return;
    const eff = effectiveInvoiceStatus(inv);
    if(eff==='Sent' || eff==='Overdue') total += Number(inv.amount)||0;
  });
  return total;
}

function overdueInvoicesList(){
  return state.invoices
    .filter(inv=> effectiveInvoiceStatus(inv)==='Overdue')
    .map(inv=>{
      const days = daysBetween(parseDate(inv.dueDate), parseDate(todayISO()));
      return { inv, client: getClient(inv.clientId), days };
    })
    .sort((a,b)=> b.days - a.days);
}
function overdueTasksList(){
  const today = todayISO();
  return state.tasks
    .filter(t=> !t.done && t.dueDate && t.dueDate < today)
    .map(t=>{
      const project = getProject(t.projectId);
      const days = daysBetween(parseDate(t.dueDate), parseDate(today));
      return { task: t, project, days };
    })
    .sort((a,b)=> b.days - a.days);
}
function staleProjectsList(){
  const today = new Date();
  return state.projects
    .filter(p=> p.status==='Active')
    .map(p=>{
      const last = p.updatedAt ? new Date(p.updatedAt) : (p.startDate? parseDate(p.startDate): null);
      const days = last ? daysBetween(last, today) : 999;
      return { project: p, client: getClient(p.clientId), days, last };
    })
    .filter(x=> x.days >= 14)
    .sort((a,b)=> b.days - a.days);
}
function tasksDueThisWeek(){
  const today = todayISO();
  const in7 = new Date(); in7.setDate(in7.getDate()+7);
  const in7ISO = in7.getFullYear()+'-'+pad2(in7.getMonth()+1)+'-'+pad2(in7.getDate());
  return state.tasks
    .filter(t=> t.dueDate && t.dueDate >= today && t.dueDate <= in7ISO)
    .map(t=> ({ task:t, project: getProject(t.projectId) }))
    .sort((a,b)=> a.task.dueDate.localeCompare(b.task.dueDate));
}
function tasksDueThisWeekCount(){ return tasksDueThisWeek().length; }

function nextInvoiceNumber(){
  let max = 0;
  state.invoices.forEach(inv=>{
    const m = /(\d+)\s*$/.exec(inv.invoiceNumber||'');
    if(m){ const n = parseInt(m[1],10); if(n>max) max=n; }
  });
  return 'INV-' + String(max+1).padStart(4,'0');
}

/* ==========================================================================
   Canvas charts — Bar, Donut, Line. No external chart library.
   ========================================================================== */
function prepCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 40);
  const h = Math.max(rect.height, 40);
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return { ctx, w, h };
}

function drawGridAndYLabels(ctx, padL, padT, chartW, chartH, niceMax, steps){
  ctx.strokeStyle = COLORS.border;
  ctx.lineWidth = 1;
  ctx.font = '10.5px Inter, sans-serif';
  ctx.fillStyle = COLORS.textDim;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for(let i=0;i<=steps;i++){
    const y = padT + chartH - (chartH*i/steps);
    ctx.beginPath();
    ctx.moveTo(padL, Math.round(y)+0.5);
    ctx.lineTo(padL+chartW, Math.round(y)+0.5);
    ctx.stroke();
    ctx.fillText(shortMoney(niceMax*i/steps), padL-8, y);
  }
}

function drawBarChart(canvas, data){
  const { ctx, w, h } = prepCanvas(canvas);
  const padL=40, padR=10, padT=10, padB=24;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const max = Math.max(...data.map(d=>d.value), 0);
  const niceMax = niceCeil(max);
  drawGridAndYLabels(ctx, padL, padT, chartW, chartH, niceMax, 4);
  const slot = chartW/data.length;
  const barW = Math.min(40, slot*0.5);
  const bars = [];
  data.forEach((d,i)=>{
    const x = padL + slot*i + (slot-barW)/2;
    const barH = niceMax>0 ? chartH*(d.value/niceMax) : 0;
    const y = padT+chartH-barH;
    ctx.fillStyle = d.isCurrent ? COLORS.amber : COLORS.accent;
    roundRect(ctx, x, y, barW, Math.max(barH,2), 5);
    ctx.fill();
    ctx.fillStyle = COLORS.textDim;
    ctx.textAlign = 'center'; ctx.textBaseline='top';
    ctx.font = '11px Inter, sans-serif';
    ctx.fillText(d.label, x+barW/2, padT+chartH+7);
    bars.push({ x, y: padT, w: barW, h: chartH, d });
  });
  canvas._bars = bars;
}

function drawDonut(canvas, segments, centerLabel, emptyLabel){
  const { ctx, w, h } = prepCanvas(canvas);
  const cx = w/2, cy = h/2;
  const r = Math.min(w,h)/2 - 6;
  const thickness = Math.max(13, r*0.34);
  const total = segments.reduce((s,seg)=> s+seg.value, 0);
  if(total<=0){
    ctx.beginPath();
    ctx.arc(cx,cy,r-thickness/2,0,Math.PI*2);
    ctx.lineWidth = thickness;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.stroke();
  } else {
    let start = -Math.PI/2;
    segments.forEach(seg=>{
      if(seg.value<=0) return;
      const angle = (seg.value/total)*Math.PI*2;
      ctx.beginPath();
      ctx.arc(cx,cy,r-thickness/2,start,start+angle-0.02);
      ctx.lineWidth = thickness;
      ctx.strokeStyle = seg.color;
      ctx.lineCap = 'round';
      ctx.stroke();
      start += angle;
    });
  }
  ctx.fillStyle = COLORS.text;
  ctx.font = '700 22px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(total<=0 ? '0' : String(total), cx, cy-7);
  ctx.font = '10.5px Inter, sans-serif';
  ctx.fillStyle = COLORS.textDim;
  ctx.fillText(total<=0 ? emptyLabel : (total===1?'total':'total'), cx, cy+11);
}

function drawLineChart(canvas, data){
  const { ctx, w, h } = prepCanvas(canvas);
  const padL=44, padR=14, padT=14, padB=24;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const max = Math.max(...data.map(d=>d.value), 0);
  const niceMax = niceCeil(max);
  drawGridAndYLabels(ctx, padL, padT, chartW, chartH, niceMax, 4);
  const n = data.length;
  const pts = data.map((d,i)=>({
    x: padL + (n>1 ? chartW*(i/(n-1)) : chartW/2),
    y: padT + chartH - (niceMax>0 ? chartH*(d.value/niceMax) : 0),
    d
  }));
  if(pts.length){
    const grad = ctx.createLinearGradient(0, padT, 0, padT+chartH);
    grad.addColorStop(0, hexToRgba(COLORS.accent, 0.32));
    grad.addColorStop(1, hexToRgba(COLORS.accent, 0));
    ctx.beginPath();
    ctx.moveTo(pts[0].x, padT+chartH);
    pts.forEach(p=> ctx.lineTo(p.x,p.y));
    ctx.lineTo(pts[pts.length-1].x, padT+chartH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    pts.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.5, 0, Math.PI*2);
      ctx.fillStyle = p.d.isCurrent ? COLORS.amber : COLORS.accent;
      ctx.fill();
      ctx.strokeStyle = COLORS.bg2;
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }
  ctx.fillStyle = COLORS.textDim;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = '11px Inter, sans-serif';
  pts.forEach(p=> ctx.fillText(p.d.label, p.x, padT+chartH+7));
  canvas._points = pts;
}

function wireChartTooltip(canvas, tooltipEl, getItems, formatFn){
  function hide(){ tooltipEl.classList.remove('show'); }
  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const items = getItems(canvas) || [];
    let hit = null;
    for(const it of items){
      if(mx >= it.x && mx <= it.x+it.w && my >= it.y && my <= it.y+it.h){ hit = it; break; }
    }
    if(!hit){ hide(); return; }
    tooltipEl.innerHTML = formatFn(hit.d);
    tooltipEl.style.left = (it_left(hit)) + 'px';
    tooltipEl.style.top = Math.max(hit.y-6, 4) + 'px';
    tooltipEl.classList.add('show');
    function it_left(it){ return it.x + it.w/2; }
  });
  canvas.addEventListener('mouseleave', hide);
}
function wirePointTooltip(canvas, tooltipEl, formatFn){
  function hide(){ tooltipEl.classList.remove('show'); }
  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const pts = canvas._points || [];
    let best = null, bestDist = 18;
    pts.forEach(p=>{
      const dist = Math.abs(p.x-mx);
      if(dist < bestDist){ bestDist = dist; best = p; }
    });
    if(!best){ hide(); return; }
    tooltipEl.innerHTML = formatFn(best.d);
    tooltipEl.style.left = best.x + 'px';
    tooltipEl.style.top = Math.max(best.y-10, 4) + 'px';
    tooltipEl.classList.add('show');
  });
  canvas.addEventListener('mouseleave', hide);
}

/* ==========================================================================
   Inline SVG components
   ========================================================================== */
function svgRing(pct, label, size, stroke){
  size = size||44; stroke = stroke||5;
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const offset = c*(1-clamp(pct,0,1));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="progress-ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--green)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition: stroke-dashoffset .25s;"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central" class="ring-label">${escapeHtml(label)}</text>
  </svg>`;
}

function svgTimeline(startDate, dueDate, width, height){
  width = width||100; height = height||8;
  const start = parseDate(startDate), due = parseDate(dueDate);
  const now = new Date();
  let pct = 0, overdue = false;
  if(start && due && due.getTime() > start.getTime()){
    pct = clamp((now-start)/(due-start), 0, 1);
  } else if(start && !due){
    pct = 0;
  }
  if(due && now.getTime() > due.getTime()) { overdue = true; pct = 1; }
  const fill = overdue ? 'var(--red)' : 'var(--accent)';
  const tickX = clamp(pct*width, 1, width-1);
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="timeline-bar">
    <rect x="0" y="${height/2-2}" width="${width}" height="4" rx="2" fill="var(--border)"/>
    <rect x="0" y="${height/2-2}" width="${(pct*width).toFixed(1)}" height="4" rx="2" fill="${fill}"/>
    <circle cx="${tickX.toFixed(1)}" cy="${height/2}" r="3.5" fill="${fill}"/>
  </svg>`;
}

function svgHBar(filled, total, width, height, fillColor){
  width = width||120; height = height||10;
  const pct = total>0 ? clamp(filled/total,0,1) : 0;
  const fw = (pct*width).toFixed(1);
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="hbar">
    <rect x="0" y="0" width="${width}" height="${height}" rx="${height/2}" fill="var(--border)"/>
    <rect x="0" y="0" width="${fw}" height="${height}" rx="${height/2}" fill="${fillColor}"/>
  </svg>`;
}

function svgSpark(paid, outstanding, width, height){
  width = width||120; height = height||10;
  const total = paid+outstanding;
  const paidW = total>0 ? (width*(paid/total)) : 0;
  const rGreen = Math.min(height/2, paidW/2);
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="spark-bar">
    <rect x="0" y="0" width="${width}" height="${height}" rx="${height/2}" fill="var(--border)"/>
    ${total>0 ? `<rect x="0" y="0" width="${width}" height="${height}" rx="${height/2}" fill="var(--amber)"/>
    <rect x="0" y="0" width="${paidW.toFixed(1)}" height="${height}" rx="${rGreen.toFixed(1)}" fill="var(--green)"/>` : ''}
  </svg>`;
}

/* ==========================================================================
   Modal & Drawer system
   ========================================================================== */
function openModal(html, opts){
  opts = opts || {};
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay">
    <div class="modal ${opts.wide?'wide':''}" data-modal-panel>${html}</div>
  </div>`;
  // Close only when the backdrop itself is clicked (not when a click inside the
  // modal bubbles up to it) — avoids relying on stopPropagation, which would
  // otherwise block delegated [data-action] clicks on buttons inside the modal.
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  const first = root.querySelector('input,select,textarea');
  if(first) setTimeout(()=> first.focus(), 30);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function openDrawer(html){
  const root = document.getElementById('drawer-root');
  root.innerHTML = `<div class="drawer-overlay" data-action="close-drawer"></div><div class="drawer" data-drawer-panel>${html}</div>`;
  requestAnimationFrame(()=>{ root.querySelector('.drawer').classList.add('open'); });
}
function closeDrawer(){
  const root = document.getElementById('drawer-root');
  const d = root.querySelector('.drawer');
  if(!d){ root.innerHTML=''; return; }
  d.classList.remove('open');
  setTimeout(()=> root.innerHTML='', 200);
}
function refreshDrawer(html){
  const root = document.getElementById('drawer-root');
  const panel = root.querySelector('[data-drawer-panel]');
  if(panel) panel.innerHTML = html;
}
function refreshModal(html){
  const panel = document.getElementById('modal-root').querySelector('[data-modal-panel]');
  if(panel) panel.innerHTML = html;
}

function kanbanCard(p){
  const client = getClient(p.clientId);
  const prog = projectProgress(p.id);
  const overdue = p.dueDate && p.dueDate < todayISO() && p.status !== 'Complete';
  return `<div class="project-card" draggable="true" data-project-id="${p.id}" data-action="open-project" data-id="${p.id}">
    <div class="pc-top">
      <span class="color-dot" style="background:${clientColor(client)};color:${clientColor(client)}"></span>
      <span class="pc-client">${escapeHtml(client?client.name:'No client')}</span>

    <div class="pc-mid">
      <span class="pc-value mono">${fmtMoney(p.value, p.currency)}</span>
      ${svgRing(prog.pct, `${prog.done}/${prog.total}`, 34, 4)}
    </div>
    <div class="pc-timeline">${svgTimeline(p.startDate, p.dueDate, 200, 8)}</div>
    <div class="pc-due ${overdue?'overdue':''}">${p.dueDate ? 'Due '+fmtDateShort(p.dueDate) : 'No due date'}</div>
  </div>`;
}

function wireKanbanDnD(){
  document.querySelectorAll('.project-card[draggable]').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.projectId);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=> card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  document.querySelectorAll('[data-kanban-col]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if(id){ setProjectStatus(id, col.dataset.status); markDirty(); }
    });
  });
}

function renderProjectsList(){
  const rows = filteredProjects().slice().sort((a,b)=>{
    const key = projectsSort.key, dir = projectsSort.dir==='asc'?1:-1;
    let av = a[key], bv = b[key];
    if(key==='client'){ av = (getClient(a.clientId)||{}).name||''; bv = (getClient(b.clientId)||{}).name||''; }
    if(key==='value'){ av = Number(a.value)||0; bv = Number(b.value)||0; return (av-bv)*dir; }
    av = av||''; bv = bv||'';
    return String(av).localeCompare(String(bv)) * dir;
  });
  const cols = [
    { key:'name', label:'Project' }, { key:'client', label:'Client' }, { key:'status', label:'Status' },
    { key:'startDate', label:'Start' }, { key:'dueDate', label:'Due' }, { key:'value', label:'Value' },
    { key:'progress', label:'Progress' }, { key:'actions', label:'' }
  ];
  return `<div class="table-wrap"><div class="table-scroll"><table class="data-table">
    <thead><tr>${cols.map(c=>`<th ${c.key!=='progress'&&c.key!=='actions'?`data-action="sort-projects" data-key="${c.key}"`:''}>${c.label}${projectsSort.key===c.key?(projectsSort.dir==='asc'?' ↑':' ↓'):''}</th>`).join('')}</tr></thead>
    <tbody>
      ${rows.length===0 ? `<tr><td colspan="8">${emptyState('📁','No projects match this filter.')}</td></tr>` : rows.map(p=>{
        const client = getClient(p.clientId);
        const prog = projectProgress(p.id);
        const overdue = p.dueDate && p.dueDate < todayISO() && p.status!=='Complete';
        return `<tr class="clickable" data-action="open-project" data-id="${p.id}">
          <td><div class="name-cell"><span class="color-dot" style="background:${clientColor(client)};color:${clientColor(client)}"></span>${escapeHtml(p.name)}</div></td>
          <td>${escapeHtml(client?client.name:'—')}</td>
          <td>${projectStatusPill(p.status)}</td>
          <td class="mono">${fmtDateShort(p.startDate)}</td>
          <td class="mono ${overdue?'':''}" style="${overdue?'color:var(--red);font-weight:700;':''}">${fmtDateShort(p.dueDate)}</td>
          <td class="mono">${fmtMoney(p.value, p.currency)}</td>
          <td style="min-width:110px;"><div class="task-bar-track"><div class="task-bar-fill" style="width:${(prog.pct*100).toFixed(0)}%"></div></div></td>
          <td class="actions-cell" onclick="event.stopPropagation()">
            <button class="btn xs ghost" data-action="open-project" data-id="${p.id}">Open</button>
            <button class="btn xs ghost" data-action="toggle-archive-project" data-id="${p.id}">${p.status==='Archived'?'Unarchive':'Archive'}</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`;
}

function exportInvoicesCSV(){
  const headers = ['Invoice #','Client','Project','Amount','Currency','Issue Date','Due Date','Status'];
  const lines = [headers.join(',')];
  state.invoices.forEach(inv=>{
    const client = getClient(inv.clientId);
    const project = getProject(inv.projectId);
    const row = [inv.invoiceNumber, client?client.name:'', project?project.name:'', inv.amount, inv.currency, inv.issueDate, inv.dueDate, effectiveInvoiceStatus(inv)];
    lines.push(row.map(csvCell).join(','));
  });
  downloadBlob('Clientflow-Invoices.csv', new Blob([lines.join('\n')], { type:'text/csv' }));
  toast('Invoices exported as CSV.');
}
function csvCell(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

  switch(currentTab){
    case 'dashboard': renderDashboard(); break;

/* ==========================================================================
   Event delegation — actions, forms, changes
   ========================================================================== */
document.addEventListener('click', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  switch(action){
    case 'switch-tab': switchTab(target.dataset.tab); break;
    case 'set-projects-filter': projectsFilter = target.dataset.filter; renderProjects(); break;
    case 'set-projects-view': projectsViewMode = target.dataset.mode; renderProjects(); break;
    case 'sort-projects': {
      const key = target.dataset.key;
      if(projectsSort.key===key) projectsSort.dir = projectsSort.dir==='asc'?'desc':'asc';
      else projectsSort = { key, dir:'asc' };
      renderProjectsContent();
      break;
    }
    case 'set-clients-filter': clientsFilter = target.dataset.filter; renderClients(); break;
    case 'toggle-client-detail': expandedClientId = (expandedClientId===id) ? null : id; renderClients(); break;
    case 'set-invoices-filter': invoicesFilter = target.dataset.filter; renderInvoices(); break;

    case 'open-add-client': openAddClientModal(); break;
    case 'open-edit-client': openEditClientModal(id); break;
    case 'toggle-archive-client': toggleArchiveClient(id); markDirty(); break;

    case 'open-add-project': openAddProjectModal(); break;
    case 'open-edit-project': openEditProjectModal(id); break;
    case 'open-project': openProjectDrawer(id); break;
    case 'toggle-archive-project': {
      const p = getProject(id);
      if(p){ p.status = p.status==='Archived' ? 'Active' : 'Archived'; touchProject(id); markDirty(); refreshProjectDrawerIfOpen(id); }
      break;
    }

    case 'open-add-invoice': openAddInvoiceModal(target.dataset.projectId, target.dataset.clientId); break;
    case 'open-edit-invoice': openEditInvoiceModal(id); break;
    case 'mark-invoice-paid': markInvoicePaid(id); markDirty(); break;
    case 'delete-invoice': if(confirm('Delete this invoice? This cannot be undone.')){ deleteInvoice(id); markDirty(); } break;
    case 'export-invoices-csv': exportInvoicesCSV(); break;

    case 'toggle-task': {
      // Checkbox inputs are toggled via the 'change' listener below to avoid double-firing.
      if(target.tagName === 'INPUT') break;
      const pid = getTaskProjectId(id);
      toggleTask(id); markDirty(); refreshProjectDrawerIfOpen(pid);
      break;
    }
    case 'delete-task': { const pid = getTaskProjectId(id); deleteTask(id); markDirty(); refreshProjectDrawerIfOpen(pid); break; }

    case 'close-modal': closeModal(); break;
    case 'close-drawer': closeDrawer(); break;

    case 'save-now': saveNow(); break;
    case 'reconnect-file': reconnectFile(); break;
    case 'dismiss-reconnect': dismissReconnect(); break;
    case 'onboard-create-file': onboardCreateFile(); break;
    case 'onboard-open-file': onboardOpenFile(); break;
    case 'onboard-use-browser': onboardUseBrowser(); break;
    case 'link-file-create': linkNewFileFromSettings('create'); break;
    case 'link-file-open': linkNewFileFromSettings('open'); break;
    case 'export-json': downloadJSON('Clientflow-Data.json', state); toast('Data exported.'); break;
    case 'trigger-import': document.getElementById('import-file-input').click(); break;
    case 'open-clear-data': openClearDataModal(); break;
    case 'confirm-clear-data': {
      state = defaultState();
      markDirty();
      closeModal();
      toast('All data cleared.');
      break;
    }
  }
});

function getTaskProjectId(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  return t ? t.projectId : null;
}

document.addEventListener('change', (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.dataset.action;
  if(action==='toggle-task'){
    toggleTask(target.dataset.id);
    markDirty();
    refreshProjectDrawerIfOpen(getTaskProjectId(target.dataset.id));
  } else if(action==='toggle-currency'){
    const cur = target.dataset.currency;
    const idx = state.settings.activeCurrencies.indexOf(cur);
    if(target.checked && idx===-1) state.settings.activeCurrencies.push(cur);
    if(!target.checked && idx!==-1){
      if(state.settings.activeCurrencies.length<=1){ target.checked = true; return; }
      state.settings.activeCurrencies.splice(idx,1);
      if(state.settings.defaultCurrency===cur) state.settings.defaultCurrency = state.settings.activeCurrencies[0];
    }
    markDirty();
  }
});

document.getElementById('import-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(confirm('Import will replace all current data with the contents of this backup. Continue?')){
      state = mergeState(parsed);
      markDirty();
      toast('Data imported.');
    }
  }catch(err){ toast('Could not read that file — is it a valid Clientflow backup?', 'error'); }
  e.target.value = '';
});

document.addEventListener('submit', (e)=>{
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);
  const val = (name)=> fd.get(name);

  if(type==='save-client'){
    const id = form.dataset.id;
    const data = { name: val('name'), company: val('company'), email: val('email'), phone: val('phone'), currency: val('currency'), colourTag: val('colourTag'), notes: val('notes') };
    if(id){ updateClient(id, data); toast('Client updated.'); }
    else { addClient(data); toast('Client created.'); }
    closeModal(); markDirty();
  } else if(type==='save-project'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), name: val('name'), status: val('status'), startDate: val('startDate'), dueDate: val('dueDate'), value: parseFloat(val('value'))||0, currency: val('currency'), description: val('description') };
    if(id){ updateProject(id, data); toast('Project updated.'); refreshProjectDrawerIfOpen(id); }
    else { addProject(data); toast('Project created.'); }
    closeModal(); markDirty();
  } else if(type==='edit-project'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), name: val('name'), status: val('status'), startDate: val('startDate'), dueDate: val('dueDate'), value: parseFloat(val('value'))||0, currency: val('currency'), description: val('description'), notes: val('notes') };
    updateProject(id, data);
    toast('Saved.');
    markDirty();
    refreshProjectDrawerIfOpen(id);
  } else if(type==='save-invoice'){
    const id = form.dataset.id;
    const data = { clientId: val('clientId'), projectId: val('projectId')||'', invoiceNumber: val('invoiceNumber'), amount: parseFloat(val('amount'))||0, currency: val('currency'), issueDate: val('issueDate'), dueDate: val('dueDate'), status: val('status') };
    if(data.status==='Paid') data.paidDate = todayISO();
    if(id){ updateInvoice(id, data); toast('Invoice updated.'); }
    else { addInvoice(data); toast('Invoice created.'); }
    closeModal(); markDirty();
    refreshProjectDrawerIfOpen(data.projectId);
  } else if(type==='add-task'){
    const projectId = form.dataset.projectId;
    addTask(projectId, { title: val('title'), dueDate: val('dueDate'), priority: val('priority') });
    form.reset();
    markDirty();
    refreshProjectDrawerIfOpen(projectId);
  } else if(type==='settings-business'){
    state.settings.businessName = val('businessName');
    state.settings.defaultCurrency = val('defaultCurrency');
    state.settings.financialYearStart = parseInt(val('financialYearStart'),10);
    toast('Settings saved.');
    markDirty();
  }
});

/* ==========================================================================
   Boot
   ========================================================================== */
initStorage();

</script>
</body>
</html>
